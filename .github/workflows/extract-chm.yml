# Extract the CHM documentation of a media set into the corpus.
#
# The releases under sources/ ship their documentation as CHM files (the CE
# 5.0 CD1 has 98 component CHMs, the CE 4.2 emulator edition two).  This
# workflow unpacks them with tools/extract-chm.py on a runner -- the sandbox
# this corpus is maintained from has no 7z, and 7z is what reads CHM.
#
# Two modes:
#   report_only = true    extract into a staging directory and write
#                         data/reports/chm-overlap-<set>.tsv, which says how
#                         many of the pages are already in the corpus (an
#                         older Learn harvest can cover the same topic space).
#                         Nothing is added to the corpus.
#   report_only = false   extract into the corpus, refresh the indexes and
#                         commit.
#
# Runs on demand, and whenever queues/chm-sets.tsv changes.

name: Extract CHM documentation

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Entry in queues/chm-sets.tsv (empty = every entry)'
        required: false
        default: ''
      report_only:
        description: 'Measure the overlap first (no corpus changes)'
        required: false
        type: boolean
        default: true
      keep_duplicates:
        description: 'Import pages even when their title is already in the corpus'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - queues/chm-sets.tsv

concurrency:
  group: extract-chm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install 7-Zip
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z | head -3

      - name: Extract
        run: |
          set -o pipefail
          NAME="${{ github.event.inputs.name }}"
          ONLY=""
          [ -n "$NAME" ] && ONLY="--only $NAME"
          if [ "${{ github.event.inputs.report_only }}" = "true" ]; then
            python3 tools/extract-chm.py --config queues/chm-sets.tsv $ONLY \
              --staging /tmp/chm-extract --report --keep-duplicates
          else
            python3 tools/extract-chm.py --config queues/chm-sets.tsv $ONLY
          fi

      - name: Refresh indexes and commit
        if: ${{ github.event.inputs.report_only != 'true' }}
        run: |
          python3 tools/build-index.py
          python3 tools/build-index-sql.py
          python3 tools/check-corpus.py --report || true
          git config user.name "wince-docs-corpus extractor"
          git config user.email "wince-corpus-harvester@users.noreply.github.com"
          git add corpus/ data/index data/reports queues || true
          if git diff --staged --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "corpus: CHM extraction + index refresh"
          git pull --rebase
          git push

      - name: Commit the overlap report
        if: ${{ github.event.inputs.report_only == 'true' }}
        run: |
          git config user.name "wince-docs-corpus extractor"
          git config user.email "wince-corpus-harvester@users.noreply.github.com"
          git add data/reports/chm-overlap-*.tsv || true
          if git diff --staged --quiet; then
            echo "no report written"
            exit 0
          fi
          git commit -m "reports: CHM overlap (what a CHM set would add)"
          git pull --rebase
          git push
