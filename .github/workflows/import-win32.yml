# Refresh the Win32-shared material in corpus/win32/ and the reports.
#
# What it does (one HTTPS request per repository, no crawling):
#   1. download the pinned MicrosoftDocs/sdk-api commit
#   2. re-extract corpus/win32/api/ (CE-shared API names + their modules)
#   3. re-extract corpus/win32/guide/ (CE-relevant subsystems)
#   4. refresh data/reports/win32-{shared,imported}.tsv and the indexes
#   5. re-run the corpus integrity check (data/reports/corpus-problems.tsv)
#
# Update UPSTREAM in tools/fetch-upstream.py to move to a newer commit; the
# new snapshot tarball has to be committed too (sources/microsoftdocs/).

name: Refresh Win32-shared documentation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'sdk-api scope: shared (CE names only) or modules (whole modules)'
        required: true
        default: 'modules'
      pack:
        description: 'Also rebuild the sdk-api snapshot tarball in sources/microsoftdocs/'
        required: false
        type: boolean
        default: false
      push:
        description: 'Commit and push the result'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Import sdk-api (API reference)
        run: |
          python3 tools/fetch-upstream.py subset --source sdk-api \
            --scope "${{ github.event.inputs.scope }}"

      - name: Import win32 (programming guides)
        run: python3 tools/fetch-upstream.py subset --source win32

      - name: Rebuild the snapshot tarball
        if: ${{ github.event.inputs.pack == 'true' }}
        run: python3 tools/fetch-upstream.py pack --source sdk-api

      - name: Refresh reports and indexes
        run: |
          python3 tools/build-win32-map.py
          python3 tools/build-index.py
          python3 tools/build-index-sql.py
          python3 tools/check-corpus.py --report || true

      - name: Commit
        if: ${{ github.event.inputs.push == 'true' }}
        run: |
          git config user.name "wince-docs-corpus importer"
          git config user.email "wince-corpus-harvester@users.noreply.github.com"
          git add corpus/win32 data/reports/win32-imported.tsv \
            data/reports/win32-shared.tsv data/index sources/microsoftdocs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "corpus: refresh Win32-shared material"
          # Another run may have committed while this one worked: merge
          # instead of stopping on the generated files.
          git pull --rebase || {
            git rebase --abort || true
            git merge --no-edit -X ours "origin/${{ github.ref_name }}"
          }
          git push
