name: Windows CE Documentation Harvester

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of URLs to fetch (0 for all)'
        required: false
        default: '0'
      delay:
        description: 'Delay between requests in seconds'
        required: false
        default: ''
      commit_interval:
        description: 'Number of pages per batch git commit & push (default: 1000)'
        required: false
        default: '1000'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT || secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Harvester with Batch Commit & Push
        env:
          GIT_PAT: ${{ secrets.GIT_PAT || secrets.GITHUB_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GIT_PAT }}
        run: |
          DELAY_ARG=""
          if [ -n "${{ github.event.inputs.delay }}" ]; then
            DELAY_ARG="--delay ${{ github.event.inputs.delay }}"
          fi
          python harvest.py --limit "${{ github.event.inputs.limit || '0' }}" $DELAY_ARG --commit-interval "${{ github.event.inputs.commit_interval || '1000' }}" --auto-push

      - name: Final commit and push check
        env:
          PAT_TOKEN: ${{ secrets.GIT_PAT || secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MSLearn/ MSDN/ Microsoft/ Wayback/ Other/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: final update harvested Windows CE documentation corpus" && git push)
