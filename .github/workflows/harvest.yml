# Harvest workflow (reorganized tree).
#
# GitHub only executes workflow files that live in .github/workflows/, and
# pushing changes under that path requires a credential with the `workflows`
# permission. The copy installed in .github/workflows/ is kept in sync by the
# repository owner; this staged copy is the same job with the current tooling
# and the extra steps that are useful after the 2026-10 additions:
#
#   * --queue "queues/..." and tools/build-index.py (post-reorganization paths)
#   * a --dry-run option, to preview what a queue would still fetch
#   * the Win32 map report refresh (tools/build-win32-map.py)
#   * data/logs/ staged, corpus/ and data/index/ committed
#
# Install with:  git mv .actions/harvest.yml .github/workflows/harvest.yml
# (see .actions/README.md).

name: Windows CE Documentation Harvester

on:
  workflow_dispatch:
    inputs:
      queue:
        description: 'URL queue file under queues/ (e.g. to-fetch-mslearn.txt, wayback-msdn-2010.txt)'
        required: true
        default: 'to-fetch-mslearn.txt'
      limit:
        description: 'Limit number of URLs to fetch (0 for all)'
        required: false
        default: '0'
      batch:
        description: 'Pages per batch commit & push'
        required: false
        default: '500'
      dry_run:
        description: 'Preview only (no fetching, no commits)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run harvester (rate-limited, batch push)
        run: |
          git config user.name "wince-docs-corpus harvester"
          git config user.email "wince-corpus-harvester@users.noreply.github.com"
          LIMIT_ARG=""
          if [ "${{ github.event.inputs.limit }}" != "0" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 tools/harvest.py \
              --queue "queues/${{ github.event.inputs.queue }}" $LIMIT_ARG --dry-run
            exit 0
          fi
          python3 tools/harvest.py \
            --queue "queues/${{ github.event.inputs.queue }}" \
            --batch "${{ github.event.inputs.batch }}" $LIMIT_ARG --push

      - name: Refresh index and final push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 tools/build-index.py
          python3 tools/build-index-sql.py
          python3 tools/build-win32-map.py
          git add data/index/ data/reports/ corpus/ data/logs/ || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "corpus: index refresh + final harvest batch"
            git pull --rebase
            git push
          fi
