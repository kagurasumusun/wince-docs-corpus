# Harvest workflow.
#
# Runs tools/harvest.py for one queue on a GitHub runner -- the only network
# that has a route to learn.microsoft.com / web.archive.org -- then refreshes
# the indexes, the integrity report and the Win32 map:
#
#   * --queue "queues/..." is resumable: page ids that are already stored are
#     skipped, so a run that hits the 6-hour job limit simply continues on the
#     next run, and a queue can be re-run at any time
#   * --dry-run previews what a queue would fetch, without making a request
#   * tools/check-corpus.py --report for
#     data/reports/{duplicates,corpus-problems}.tsv
#   * tools/check-policy.py: the corpus has to stay Windows CE documentation
#   * tools/dedupe-corpus.py --check: the alias table stays intact
#   * tools/build-kb.py: knowledge/ is rebuilt from the pages, so the
#     knowledge base never drifts from the corpus
#     only (docs/COLLECTION-POLICY.md) - a harvested page that is not out of
#     scope fails the run
#   * data/reports/harvest-last.json records what the run did (counters, rate)
#   * data/logs/ staged, corpus/ data/index/ data/reports/ committed
#
# How to start a run -- three ways:
#
#   1. Actions tab -> "Windows CE Documentation Harvester" -> Run workflow
#      (queue, limit, batch, dry_run), see queues/README.md
#   2. Push a change to queues/auto-harvest.txt: the run starts immediately
#      with that file's settings (that is also the quickest way to test);
#      the file is committed, so the budget lives in the repository and an
#      "off" line (as now) keeps a push from doing anything
#   3. A schedule, if one is added below, reads queues/auto-harvest.txt
#
# Politeness is enforced inside tools/harvest.py: at most one request in
# flight per host, a fixed delay per host (0.4 s learn / 1.5 s archive.org),
# robots.txt honoured, and the delay doubles on 429/503 responses.

name: Windows CE Documentation Harvester

on:
  workflow_dispatch:
    inputs:
      queue:
        description: 'URL queue file under queues/ (e.g. to-fetch-mslearn.txt, wayback-msdn-2010.txt)'
        required: true
        default: 'to-fetch-mslearn.txt'
      limit:
        description: 'Limit number of URLs to fetch (0 for all)'
        required: false
        default: '0'
      batch:
        description: 'Pages per batch commit & push'
        required: false
        default: '500'
      dry_run:
        description: 'Preview only (no fetching, no commits)'
        required: false
        type: boolean
        default: false
  # No schedule: both page queues are done (see queues/auto-harvest.txt, which
  # is `off`), so the automatic collection is the mirror crawl instead
  # (crawl-mirror.yml, twice a day).  Add a cron line here again when a new
  # queue exists - a scheduled run reads queues/auto-harvest.txt.
  push:
    paths:
      - queues/auto-harvest.txt

concurrency:
  group: harvest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    # Hard cap: the harvester also stops itself after --max-seconds (the 4th
    # field of queues/auto-harvest.txt), so a slow or rate-limiting host can
    # neither run for hours nor leave a half-finished batch uncommitted.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Decide what to harvest
        id: plan
        run: |
          QUEUE="${{ github.event.inputs.queue }}"
          LIMIT="${{ github.event.inputs.limit }}"
          BATCH="${{ github.event.inputs.batch }}"
          DRY="${{ github.event.inputs.dry_run }}"
          BUDGET=""
          if [ -z "$QUEUE" ]; then
            # A scheduled or control-file-triggered run: the committed file
            # names the queue and the per-run budget.
            LINE="$(grep -vE '^[[:space:]]*(#|$)' queues/auto-harvest.txt | head -1 || true)"
            set -- $LINE
            QUEUE="${1:-}"
            LIMIT="${2:-0}"
            BATCH="${3:-500}"
            BUDGET="${4:-5400}"
            DRY="false"
            if [ -z "$QUEUE" ] || [ "$QUEUE" = "off" ]; then
              echo "queues/auto-harvest.txt does not name a queue -- nothing to do."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ ! -f "queues/$QUEUE" ]; then
              echo "::error::queues/auto-harvest.txt names queues/$QUEUE, which does not exist"
              exit 1
            fi
          fi
          echo "queue=$QUEUE" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "harvesting queues/$QUEUE (limit=$LIMIT, batch=$BATCH, time budget=${BUDGET:-none}s, dry_run=$DRY)"

      - name: Run harvester (rate-limited, batch push)
        if: steps.plan.outputs.enabled == 'true'
        run: |
          git config user.name "wince-docs-corpus harvester"
          git config user.email "wince-corpus-harvester@users.noreply.github.com"
          LIMIT_ARG=""
          if [ "${{ steps.plan.outputs.limit }}" != "0" ]; then
            LIMIT_ARG="--limit ${{ steps.plan.outputs.limit }}"
          fi
          if [ "${{ steps.plan.outputs.dry_run }}" = "true" ]; then
            python3 tools/harvest.py \
              --queue "queues/${{ steps.plan.outputs.queue }}" $LIMIT_ARG \
              --dry-run --summary data/reports/harvest-last.json
            exit 0
          fi
          BUDGET_ARG=""
          if [ -n "${{ steps.plan.outputs.budget }}" ]; then
            BUDGET_ARG="--max-seconds ${{ steps.plan.outputs.budget }}"
          fi
          python3 tools/harvest.py \
            --queue "queues/${{ steps.plan.outputs.queue }}" \
            --batch "${{ steps.plan.outputs.batch }}" $LIMIT_ARG $BUDGET_ARG \
            --push --summary data/reports/harvest-last.json

      - name: Refresh index, integrity report and final push
        if: steps.plan.outputs.enabled == 'true' && steps.plan.outputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 tools/build-index.py
          python3 tools/build-index-sql.py
          python3 tools/build-ce-api-names.py
          python3 tools/build-win32-map.py
          # the alias table has to stay intact (a collapsed page must not
          # come back, its keeper must not change) and the knowledge base has
          # to be rebuilt from the pages this run changed
          python3 tools/dedupe-corpus.py --check
          python3 tools/build-kb.py --workers 4
          python3 tools/check-kb.py
          python3 tools/check-corpus.py --report || true
          python3 tools/check-policy.py
          python3 tools/summarize-harvest.py || true
          git add data/index/ data/reports/ corpus/ data/logs/ knowledge || true

          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "corpus: harvest run + index refresh"
            git pull --rebase
            git push
          fi

      - name: Report harvest budget
        if: steps.plan.outputs.enabled == 'true' && always()
        run: |
          if [ -f data/reports/harvest-history.tsv ]; then
            echo "### Recent harvest runs"
            echo '```'
            tail -6 data/reports/harvest-history.tsv
            echo '```'
          fi
