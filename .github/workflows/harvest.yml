# Harvest workflow (reorganized tree).
#
# Runs tools/harvest.py for one queue on a GitHub runner (the only network
# with a route to learn.microsoft.com / web.archive.org), then refreshes the
# indexes and the integrity report:
#
#   * --queue "queues/..." is resumable: already-stored page ids are skipped,
#     so a run that hits the 6-hour limit continues on the next dispatch
#   * --dry-run previews what a queue would fetch, without any request
#   * the Win32 map report refresh (tools/build-win32-map.py)
#   * tools/check-corpus.py --report for data/reports/{duplicates,corpus-problems}.tsv
#   * data/logs/ staged, corpus/ data/index/ data/reports/ committed
#
# See queues/README.md for the run instructions and the size of each queue.

name: Windows CE Documentation Harvester

on:
  workflow_dispatch:
    inputs:
      queue:
        description: 'URL queue file under queues/ (e.g. to-fetch-mslearn.txt, wayback-msdn-2010.txt)'
        required: true
        default: 'to-fetch-mslearn.txt'
      limit:
        description: 'Limit number of URLs to fetch (0 for all)'
        required: false
        default: '0'
      batch:
        description: 'Pages per batch commit & push'
        required: false
        default: '500'
      dry_run:
        description: 'Preview only (no fetching, no commits)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run harvester (rate-limited, batch push)
        run: |
          git config user.name "wince-docs-corpus harvester"
          git config user.email "wince-corpus-harvester@users.noreply.github.com"
          LIMIT_ARG=""
          if [ "${{ github.event.inputs.limit }}" != "0" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 tools/harvest.py \
              --queue "queues/${{ github.event.inputs.queue }}" $LIMIT_ARG --dry-run
            exit 0
          fi
          python3 tools/harvest.py \
            --queue "queues/${{ github.event.inputs.queue }}" \
            --batch "${{ github.event.inputs.batch }}" $LIMIT_ARG --push

      - name: Refresh index, integrity report and final push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 tools/build-index.py
          python3 tools/build-index-sql.py
          python3 tools/build-win32-map.py
          python3 tools/check-corpus.py --report || true
          git add data/index/ data/reports/ corpus/ data/logs/ || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "corpus: index refresh + final harvest batch"
            git pull --rebase
            git push
          fi
