<h2><a name="_vcce_supported_images"></a>Supported Images</h2>
<p>
Note that Windows CE Help supports only bitmaps as embedded images. </p>
<p>
The following files are not supported:
<ul>
<li>
.GIF files</li>
<li>
.JPG files.</li>
</ul>
