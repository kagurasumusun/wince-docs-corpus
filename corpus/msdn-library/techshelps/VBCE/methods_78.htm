<h2><a name="_vbce_showcolor"></a>ShowColor</h2>
<p>
Displays the <b>CommonDialog</b> control's Color dialog box.. </p>
<h4>Syntax</h4>
<p>
<i>object</i><b>.ShowColor</b></p>
<p>
The <i>object</i> placeholder represents an object expression that evaluates to an object.</p>
