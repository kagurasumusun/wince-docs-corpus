<h2><a name="_vbce_changing_a_value"></a>Changing a Value</h2>
<h4><img src="wedge.gif" border=0>&nbsp;&nbsp;&nbsp;&nbsp;To change a Windows CE registry value</h4>
<ol>
<li>
Double-click the value you want to change to open the editing dialog box.</li>
<li>
In the <b>Value data </b>box, type the new data for the value.</li>
</ol>
