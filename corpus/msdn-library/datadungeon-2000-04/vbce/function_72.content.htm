<H2>

<A NAME="_vbce_vbs_space"></A>Space</H2>

<P>This function creates a string consisting of a specified number of spaces.</P>

<H4>Syntax</H4>

<P><B>Space</B>(<I>number</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>number</I></DT>

<DD>Number of spaces in the string.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns a string.</P>

<H4>Remarks</H4>

<P>Use the <B>String</B> function to generate a string of characters other than spaces.</P>
