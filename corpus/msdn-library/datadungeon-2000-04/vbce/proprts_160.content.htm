<H2>

<A NAME="_vbce_localhostname"></A>LocalHostName</H2>

<P>This property returns a string containing the local computer name. </P>

<H4>Syntax</H4>

<P><I>object</I>.<B>LocalHostName</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Object expression that evaluates to a <B>Winsock</B> control.</dd>
</DL>

<H4>Remarks</H4>

<P>The <B>LocalHostName</B> property is read-only at run time. It is unavailable at design time. </P>
<p>&nbsp;</p></body>
