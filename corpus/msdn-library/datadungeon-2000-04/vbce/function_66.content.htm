<H2>

<A NAME="_vbce_vbs_scriptenginebuildversion"></A>ScriptEngineBuildVersion</H2>

<P>This function identifies the build version number of the script engine in use.</P>

<H4>Syntax</H4>

<P><B>ScriptEngineBuildVersion</B></P>

<H4>Return Values</H4>

<P>Returns the build version number. </P>

<H4>Remarks</H4>

<P>The return value is obtained from the version information contained in the file Vbscript.dll.</P>
