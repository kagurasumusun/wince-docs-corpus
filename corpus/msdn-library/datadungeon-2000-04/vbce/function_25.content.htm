<H2>

<A NAME="_vbce_disconnectevents"></A>DisconnectEvents</H2>

<P>This function disconnects event handlers from an object created with the <B>CreateObjectWithEvents </B>function.</P>

<H4>Syntax</H4>

<P><B>DisconnectEvents</B>(<I>objectinstance as object</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>objectinstance</I></DT>

<DD>Object created with the <B>CreateObjectWithEvents</B> function.
</dd>
</DL>

<H4>Return Values</H4>

<P>None.</P>
