<H2>

<A NAME="_vbce_rtrim"></A>RTrim</H2>

<P>This function removes trailing spaces from a string.</P>

<H4>Syntax</H4>

<P><B>RTrim</B>(<I>string</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>string</I></DT>

<DD>Any valid string expression. If <I>string</I> contains <B>Null</B>, Null is returned.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns a string.</P>
