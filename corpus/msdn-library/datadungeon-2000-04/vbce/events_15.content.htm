<H2>

<A NAME="_vbce_dblclick"></A>DblClick</H2>

<P>This event occurs when the user double-clicks an object.</P>

<H4>Syntax</H4>

<P><B>Private Sub </B><I>object</I>_<B>DblClick</B>( )</P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Object expression that evaluates to a form or control.
</dd>
</DL>

<H4>Remarks</H4>

<P>None.</P>
