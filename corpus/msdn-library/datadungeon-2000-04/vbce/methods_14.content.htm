<H2>

<A NAME="_vbce_close_file_"></A>Close (File)</H2>

<P>This method closes an open <B>File</B> control. </P>

<H4>Syntax</H4>

<P><I>file</I>.<B>Close</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>file</I></DT>

<DD>Name of a <B>File</B> control.
</dd>
</DL>

<H4>Return Value</H4>

<P>None.</P>

<H4>Remarks</H4>

<P>Use the <B>Open </B>method to open a file.</P>
