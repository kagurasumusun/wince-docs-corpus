<H2>

<A NAME="_vbce_lof"></A>LOF</H2>

<P>This property returns a number representing the size, in bytes, of a file.</P>

<H4>Syntax</H4>

<P><I>file.</I><B>LOF</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>file</I></DT>

<DD>Reference to a <B>File</B> control.
</dd>
</DL>

<H4>Remarks</H4>

<P>The <B>LOF </B>property can be used with the <B>Loc </B>property to guarantee that a read operation does not continue past the end of a file.</P>
