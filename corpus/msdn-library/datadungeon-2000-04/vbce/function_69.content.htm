<H2>

<A NAME="_vbce_vbs_second"></A>Second</H2>

<P>This function converts an expression to a whole number that represents the second of the minute.</P>

<H4>Syntax</H4>

<P><B>Second</B>(<I>time</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>time</I></DT>

<DD>Any expression that can represent a time.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns a whole number from 0 through 59. </P>
