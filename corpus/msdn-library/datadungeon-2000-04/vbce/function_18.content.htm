<H2>

<A NAME="_vbce_vbs_date"></A>Date</H2>

<P>This function retrieves the current system date.</P>

<H4>Syntax</H4>

<P><B>Date</B></P>

<H4>Return Values</H4>

<P>Returns a <B>Variant</B> of subtype <B>Date</B>. </P>

<H4>Remarks</H4>

<P>Use <B>Now</B> instead of <B>Date</B> if you want the system time returned as well. <B>Date</B> does not return time information.</P>
