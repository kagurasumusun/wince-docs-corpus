<H2>

<A NAME="_vbce_objects"></A>Objects</H2>

<P>An object is a combination of code and data that can be treated as a unit. An object also can be a piece of an application, such as a control or a form, or an entire application. This chapter documents the objects supported by the Microsoft Windows CE Toolkit for Visual Basic 6.0.</P>
