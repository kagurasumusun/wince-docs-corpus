<H2>

<A NAME="_vbce_activeform"></A>ActiveForm</H2>

<P>This property returns the form that is the active window. </P>

<H4>Syntax</H4>

<P><I>screen</I>.<B>ActiveForm</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>screen </I></DT>

<DD>Reference to the <B>Screen </B>object.
</dd>
</DL>

<H4>Remarks</H4>

<P>The<B> ActiveForm</B> property is read-only; it is unavailable at design time. A form is the active form when a control on the form has the focus.</P>
