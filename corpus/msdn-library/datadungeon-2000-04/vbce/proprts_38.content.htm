<H2>

<A NAME="_vbce_children"></A>Children</H2>

<P>This <B>Node </B>object property returns the number of child <B>Node</B> objects.</P>

<H4>Syntax</H4>

<P><I>treeview</I>.<B>Children</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>treeview</I></DT>

<DD>Object expression that evaluates to a <B>Node </B>object.
</dd>
</DL>

<H4>Remarks</H4>

<P>The <B>Children</B> property is read-only. The property can be used to determine if a <B>Node</B> object has children.</P>
<p>&nbsp;</p></body>
