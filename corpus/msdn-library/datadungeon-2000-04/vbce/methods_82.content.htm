<H2>

<A NAME="_vbce_showcolor"></A>ShowColor</H2>

<P>This method displays the <B>Color</B> dialog box<B> </B>of a <B>CommonDialog</B> control. </P>

<H4>Syntax</H4>

<P><I>commondlg</I>.<B>ShowColor</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>commondlg</I> </DT>

<DD>Reference to a <B>CommonDialog </B>control.
</dd>
</DL>

<H4>Return Value</H4>

<P>None.</P>

<H4>Remarks</H4>

<P>The color selected is returned in the <B>Color</B> property of the <B>CommonDialog</B> control.</P>
