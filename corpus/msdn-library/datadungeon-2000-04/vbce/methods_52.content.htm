<H2>

<A NAME="_vbce_mkdir"></A>MkDir</H2>

<P>This method creates a new directory.</P>

<H4>Syntax</H4>

<P><I>filesystem.</I><B>MkDir</B> <I>PathName</I></P>

<H4>Parameters</H4>

<DL>
<DT><I>filesystem</I></DT>

<DD>Reference to a <B>FileSystem</B> control.</dd>

<DT><I>Pathname</I></DT>

<DD>String expression that contains the directory name. 
</dd>
</DL>

<H4>Return Value</H4>

<P>None.</P>

<H4>Remarks</H4>

<P><B>MkDir</B> generates an error if the directory already exists.</P>
