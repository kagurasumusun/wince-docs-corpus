<H2>

<A NAME="_vbce_entercell"></A>EnterCell</H2>

<P>This event occurs when a currently active cell changes to a different cell.</P>

<H4>Syntax</H4>

<P><B>Private Sub</B> <I>grid</I><B>_EnterCell</B>( )</P>

<H4>Parameters</H4>

<DL>
<DT><I>grid </I></DT>

<DD>Object expression that evaluates to a <B>Grid </B>control.
</dd>
</DL>

<H4>Remarks</H4>

<P>Changing the active cell initiates the <B>EnterCell</B> event. </P>
