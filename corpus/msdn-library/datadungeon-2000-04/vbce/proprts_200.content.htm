<H2>

<A NAME="_vbce_remoteport"></A>RemotePort</H2>

<P>This property returns and sets the remote port number used in connecting a remote device to a desktop computer.</P>

<H4>Syntax</H4>

<P><I>object</I>.<B>RemotePort</B> [<I>= port</I>]</P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Object expression that evaluates to a <B>Winsock</B> control.</dd>

<DT><I>port</I></DT>

<DD>Remote port to which the desktop computer connects.
</dd>
</DL>
