<H2>

<A NAME="_vbce_buttonclick"></A>ButtonClick</H2>

<P>This event occurs when a user chooses a button on a <B>CommandBar</B> control. </P>

<H4>Syntax</H4>

<P><B>Private Sub </B><I>commandbar</I><B>_ButtonClick</B>(<I>button</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>commandbar</I></DT>

<DD>Object expression that evaluates to a <B>CommandBar </B>control.</dd>

<DT><I>button</I></DT>

<DD>Copy of an edited <B>CommandBarButton </B>object. 
</dd>
</DL>
