<H2>

<A NAME="_vbce_root"></A>Root</H2>

<P>This property returns a reference to the root <B>Node</B> of a <B>TreeView</B> control's <B>Node</B> objects.</P>

<H4>Syntax</H4>

<P><I>object</I>.<B>Root</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Object expression that evaluates to a <B>TreeView</B> control.
</dd>
</DL>
