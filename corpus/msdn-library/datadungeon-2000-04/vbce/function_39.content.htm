<H2>

<A NAME="_vbce_vbs_isarray"></A>IsArray</H2>

<P>This function determines whether a variable is an array.</P>

<H4>Syntax</H4>

<P><B>IsArray</B>(<I>varname</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>varname</I></DT>

<DD>Any variable.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns <B>True</B> if the variable is an array; otherwise, it returns <B>False</B>.</P>

<H4>Remarks</H4>

<P><B>IsArray</B> is especially useful with variants containing arrays.</P>
