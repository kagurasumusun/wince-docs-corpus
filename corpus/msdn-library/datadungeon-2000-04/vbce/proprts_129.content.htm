<H2>

<A NAME="_vbce_imagelist"></A>ImageList</H2>

<P>This property returns and sets any <B>ImageList</B> control that is associated with another control.</P>

<H4>Syntax</H4>

<P><I>object</I>.<B>ImageList </B>[= <I>hImagelist</I>]</P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Object expression that evaluates to an <B>ImageList</B> control.</dd>

<DT><I>himagelist</I></DT>

<DD>Object expression that evaluates to an <B>hImageList</B> property.
</dd>
</DL>
