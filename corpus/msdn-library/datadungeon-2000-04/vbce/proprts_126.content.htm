<H2>

<A NAME="_vbce_icons"></A>Icons</H2>

<P>This property returns and sets the<B> ImageList</B> controls associated with the Icon view in a <B>ListView </B>control.</P>

<H4>Syntax</H4>

<P><I>object</I>.<B>Icons</B> [= <I>hImageList</I>]</P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Object expression that evaluates to a <B>ListView</B> control.</dd>

<DT><I>hImageList</I></DT>

<DD>Object expression that evaluates to an <B>hImageList</B> property.
</dd>
</DL>
