<H2>

<A NAME="_vbce_servicename"></A>ServiceName</H2>

<P>This property sets or returns the name of the service for an IrDA connection.</P>

<H4>Syntax</H4>

<P><I>object</I>.<B>ServiceName</B> [<I>=</I> <I>string</I>]</P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Object expression that evaluates to a <B>Winsock</B> control.</dd>

<DT><I>string</I></DT>

<DD>Name of the service for an IrDA connection.
</dd>
</DL>
