<H2>

<A NAME="_vbce_vbs_isobject"></A>IsObject</H2>

<P>This function determines whether an expression references a valid Automation object.</P>

<H4>Syntax</H4>

<P><B>IsObject</B>(<I>expression</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>expression</I></DT>

<DD>Any expression.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns <B>True</B> if <I>expression</I> is a variable of <B>Object</B> subtype or a user-defined object; otherwise, it returns <B>False</B>. </P>
