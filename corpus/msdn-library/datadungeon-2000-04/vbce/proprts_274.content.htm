<H2>

<A NAME="_vbce_tooltip"></A>ToolTip</H2>

<P>This property returns or sets the tooltip of an button. </P>

<H4>Syntax</H4>

<P><I>object</I>.<B>ToolTip </B>[= <I>string</I>]</P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Object expression that evaluates to a <B>CommandBar</B> control.</dd>

<DT><I>string</I></DT>

<DD>A string that is displayed when the mouse pointer hovers over the object.
</dd>
</DL>
