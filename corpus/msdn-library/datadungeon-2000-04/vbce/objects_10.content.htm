<H2>

<A NAME="_vbce_font_object"></A>Font Object</H2>

<P>This object contains data needed to format text for display in the interface of an application.</P>

<H4>Syntax</H4>

<P><B>Font</B></P>

<P>The <B>Font</B> object supports the following properties:</P>

<TR VALIGN="top">
<TD width=24%><A HREF="proprts_11.htm" TARGET="_top"><B>Bold</B></A></TD>
<TD width=76%><A HREF="proprts_249.htm" TARGET="_top"><B>Strikethrough</B></A></TD>
</TR>

<TR VALIGN="top">
<TD width=24%><A HREF="proprts_140.htm" TARGET="_top"><B>Italic</B></A></TD>
<TD width=76%><A HREF="proprts_278.htm" TARGET="_top"><B>Underline</B></A></TD>
</TR>

<TR VALIGN="top">
<TD width=24%><A HREF="proprts_177.htm" TARGET="_top"><B>Name</B></A></TD>
<TD width=76%><A HREF="proprts_284.htm" TARGET="_top"><B>Weight</B></A></TD>
</TR>

<TR VALIGN="top">
<TD width=24%><A HREF="proprts_234.htm" TARGET="_top"><B>Size</B></A></TD>
<TD width=76%>&nbsp;</TD>
</TR>
