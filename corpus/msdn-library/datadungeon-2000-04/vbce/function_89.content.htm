<H2>

<A NAME="_vbce_vbs_year"></A>Year</H2>

<P>This function retrieves an integer representing the year.</P>

<H4>Syntax</H4>

<P><B>Year</B>(<I>date</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>date</I></DT>

<DD>Any expression that can represent a date. If <I>date</I> contains <B>Null</B>, Null is returned.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns an integer.</P>

<P></P>
