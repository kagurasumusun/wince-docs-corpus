<H2>

<A NAME="_vbce_sendcomplete"></A>SendComplete</H2>

<P>This event occurs when a <B>Winsock </B>control completes the transmission of data.</P>

<H4>Syntax</H4>

<P><B>Private Sub </B><I>winsock_</I><B>SendComplete</B>( )</P>

<H4>Parameters</H4>

<DL>
<DT><I>winsock</I></DT>

<DD>Object expression that evaluates to a <B>Winsock </B>control.
</dd>
</DL>

<H4>Remarks</H4>

<P>Use the <B>SendData </B>method to send data from a <B>Winsock </B>control.</P>
