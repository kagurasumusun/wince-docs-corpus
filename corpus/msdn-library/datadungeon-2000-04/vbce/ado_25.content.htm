<H2>

<A NAME="_adoce_count"></A>Count</H2>

<P>This property indicates the number of fields in a recordset.</P>

<H4>Syntax</H4>

<P><I>fields</I>.<B>Count</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>fields</I></DT>

<DD>Specifies the <B>Fields </B>collection of an open <B>Recordset</B>.</dd>
</DL>

<H4>Example</H4>

<PRE><CODE>Dim rs
Set rs = CreateObject("adoce.recordset")
rs.Open "MSysIndexes"
MsgBox rs.Fields.Count
rs.Close
Set rs = Nothing
</CODE></PRE>
