<H2>

<A NAME="_vbce_screen_object"></A>Screen Object</H2>

<P>This object obtains information about the display on a device.</P>

<H4>Syntax</H4>

<P><B>Screen</B></P>

<P>The <B>Screen</B> object supports the following properties:</P>

<TABLE cellspacing=4 cols=2>

<TR VALIGN="top">
<TD width=25%><A HREF="proprts_1.htm" TARGET="_top"><B>ActiveControl</B></A></TD>
<TD width=75%><A HREF="proprts_115.htm" TARGET="_top"><B>Height</B></A></TD>
</TR>

<TR VALIGN="top">
<TD width=25%><A HREF="proprts_2.htm" TARGET="_top"><B>ActiveForm</B></A></TD>
<TD width=75%><A HREF="proprts_275.htm" TARGET="_top"><B>TwipsPerPixelX</B></A></TD>
</TR>

<TR VALIGN="top">
<TD width=25%><A HREF="proprts_97.htm" TARGET="_top"><B>FontCount</B></A></TD>
<TD width=75%><A HREF="proprts_276.htm" TARGET="_top"><B>TwipsPerPixelY</B></A></TD>
</TR>

<TR VALIGN="top">
<TD width=25%><A HREF="proprts_100.htm" TARGET="_top"><B>Fonts</B></A></TD>
<TD width=75%><A HREF="proprts_285.htm" TARGET="_top"><B>Width</B></A></TD>
</TR>
</TABLE><BR>

<H4>Remarks</H4>

<P>The keyword <B>Screen</B> accesses the <B>Screen</B> object. </P>
