<H2>

<A NAME="_vbce_number"></A>Number</H2>

<P>This property returns and sets a numeric value that specifies an error. </P>

<H4>Syntax</H4>

<P><I>object</I>.<B>Number</B> [<I>= errornumber</I>]</P>

<H4>Parameters</H4>

<DL>
<DT><I>object</I></DT>

<DD>Always the <B>Err</B> object. </dd>

<DT><I>errornumber</I></DT>

<DD>Integer that represents an error number. 
</dd>
</DL>

<H4>Remarks</H4>

<P><B>Number</B> is the <B>Err</B> object's default property.</P>
