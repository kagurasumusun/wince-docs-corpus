<H2>

<A NAME="_vbce_comparison_constants"></A>Comparison Constants</H2>

<P>The following table shows the comparison constants you can use anywhere in your code in place of actual values. </P>

<TABLE cellspacing=4 cols=3>

<TR VALIGN="top">
<TD width=31%>
<H5>Constant</H5>
</TD>
<TD width=14%>
<H5>Value</H5>
</TD>
<TD width=55%>
<H5>Description</H5>
</TD>
</TR>

<TR VALIGN="top">
<TD width=31%><B>vbBinaryCompare</B></TD>
<TD width=14%>0</TD>
<TD width=55%>Perform a binary comparison</TD>
</TR>

<TR VALIGN="top">
<TD width=31%><B>vbTextCompare</B></TD>
<TD width=14%>1</TD>
<TD width=55%>Perform a textual comparison</TD>
</TR>

<TR VALIGN="top">
<TD width=31%><B>vbDatabaseCompare</B></TD>
<TD width=14%>2</TD>
<TD width=55%>Not supported</TD>
</TR>
</TABLE><BR>
