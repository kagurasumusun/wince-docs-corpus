<A NAME="_vbce_alignment_constants"></A>Alignment Constants</H2>

<P>The following table shows the form <B>Alignment</B> property constants you can use anywhere in your code in place of actual values.</P>

<TABLE cellspacing=4 cols=3>

<TR VALIGN="top">
<TD width=31%>
<H5>Constant</H5>
</TD>
<TD width=34%>
<H5>Value</H5>
</TD>
<TD width=35%>
<H5>Description</H5>
</TD>
</TR>

<TR VALIGN="top">
<TD width=31%><B>vbLeftJustify</B></TD>
<TD width=34%>0</TD>
<TD width=35%>Left align</TD>
</TR>

<TR VALIGN="top">
<TD width=31%><B>vbRightJustify</B></TD>
<TD width=34%>1</TD>
<TD width=35%>Right align</TD>
</TR>

<TR VALIGN="top">
<TD width=31%><B>vbCenter</B></TD>
<TD width=34%>2</TD>
<TD width=35%>Center</TD>
</TR>
</TABLE><BR>
