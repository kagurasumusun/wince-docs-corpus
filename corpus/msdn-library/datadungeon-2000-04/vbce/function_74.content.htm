<H2>

<A NAME="_vbce_vbs_sqr"></A>Sqr</H2>

<P>This function determines the square root of a number.</P>

<H4>Syntax</H4>

<P><B>Sqr</B>(<I>number</I>)</P>

<H4>Parameters</H4>

<DL>
<DT><I>number</I></DT>

<DD>Any valid numeric expression greater than or equal to 0.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns the square root of a number. </P>

<H4>Remarks</H4>

<P>If <I>number</I> is less than 0, <B>Sqr</B> generates an error.</P>
