<H2>

<A NAME="_adoce_cachesize"></A>CacheSize</H2>

<P>This property indicates the number of records from a <B>Recordset</B> object that are cached locally in memory.</P>

<H4>Syntax</H4>

<P><I>recordset</I>.<B>Cachesize</B></P>

<H4>Remarks</H4>

<P>ADOCE does not use this property. It always returns a value of 1 and ignores any attempts to set it.</P>
