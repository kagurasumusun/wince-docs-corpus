<H2><A NAME="_wcesdk_handling_errors"></A>Handling Errors</H2>

<P>When an error occurs, the RAS invokes the client notification handler. The notification includes the connection state when the error occurred and a code that identifies the error. In these cases, the notification handler should call the <A HREF="../../wcesdkr/htm/cf_mr_14.htm" TARGET="_top"><B>RasHangUp</B></A> function to end the RAS connection.</P>
