<H2><A NAME="_wcesdk_handling_authentication"></A>Handling Authentication</H2>

<P>Authentication is sometimes required before accessing resources on the Internet. Windows CE supports functions for server and proxy authentication for HTTP sessions. Authentication for FTP servers must be handled by the <B>InternetConnect</B> function. </P>
