<H2><A NAME="_wcesdk_retrieving_network_data"></A>Retrieving Network Data</H2>

<P>WNet provides functions to retrieve network data in order to connect or disconnect from network resources. These functions perform the following tasks:

<UL>
	<LI>Retrieving a connection name</li>

	<LI>Retrieving a user name</li>

	<LI>Retrieving network errors</li>
</UL>
