<H1><A NAME="_adoce_cachesize"></A>CacheSize</H1>

<P>This property specifies the number of records from a recordset that are cached locally in memory.</P>

<P><B>Syntax</B></P>

<P><CODE><I>recordset</I>.<B>CacheSize</B></CODE></P>

<P><B>Remarks</B></P>

<P>ADOCE does not use this property. It always returns a value of 1 and ignores any attempts to set it.</P>
