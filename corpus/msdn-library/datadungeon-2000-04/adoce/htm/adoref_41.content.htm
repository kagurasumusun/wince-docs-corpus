<H1><A NAME="_adoce_underlyingvalue"></A>UnderlyingValue</H1>

<P>This property indicates the current value of a <B>Field</B> object in the database.</P>

<P><B>Syntax</B></P>

<P><CODE><I>var</I> = <I>field</I>.<B>UnderlyingValue</B></CODE></P>

<P><B>Return Values</B></P>

<P>Returns a <B>Variant</B> value.</P>

<P><B>Remarks</B></P>

<P>Use the <B>UnderlyingValue</B> property to return the current field value from the database. </P>
