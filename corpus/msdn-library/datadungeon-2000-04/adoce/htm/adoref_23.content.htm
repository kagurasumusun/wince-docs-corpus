<H1><A NAME="_adoce_activeconnection"></A>ActiveConnection</H1>

<P>This property sets the current database connection.</P>

<P><B>Syntax</B></P>

<P><CODE><B>var</B> = <B>recordset</B>.<B>ActiveConnection</B> </CODE></P>

<P><B>Remarks</B></P>

<P>This property is always a zero-length string ("").</P>

<P>The ActiveConnection property is write-only because there is no <B>Connection</B> object in ADOCE.</P>
