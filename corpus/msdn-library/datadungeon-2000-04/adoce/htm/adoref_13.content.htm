<H1><A NAME="_adoce_movefirst"></A>MoveFirst </H1>

<P>This method makes the first row active.</P>

<P><B>Syntax</B></P>

<P><CODE><I>recordset</I>.<B>MoveFirst</B></CODE></P>

<P><B>Remarks</B></P>

<P>Use the <B>MoveFirst</B> method to move the current record position to the first record in the recordset.</P>
