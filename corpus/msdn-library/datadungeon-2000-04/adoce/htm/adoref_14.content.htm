<H1><A NAME="_adoce_movelast"></A>MoveLast</H1>

<P>This method makes the last row active.</P>

<P><B>Syntax</B></P>

<P><I>recordset</I>.<B>MoveLast</B></P>

<P><B>Remarks</B></P>

<P>Use the <B>MoveLast</B> method to move the current record position to the last record in the recordset. </P>
