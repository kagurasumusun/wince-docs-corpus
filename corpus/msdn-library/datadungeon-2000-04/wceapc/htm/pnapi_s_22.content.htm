<H2><A NAME="_wcesdk_pntm"></A>PNTM</H2>

<P>This structure stores time to the millisecond.</P>

<H4>Syntax</H4>

<P><B>typedef struct tagPNTM{<BR>
DWORD </B><I>dwMillisec</I><B>; <BR>
DWORD </B><I>dwDay</I><B>;<BR>
} PNTM;</B></P>

<H4>Members</H4>

<DL>
<DT><I>dwMillisec</I></DT>

<DD>Specifies the number of milliseconds since start of day. This value must be from 0 through 86400000.</dd>

<DT><I>dwDay</I></DT>

<DD>Specifies the days since Jan 1, 1900
</dd>
</DL>
