<H2><A NAME="_wcesdk_iasplaylist_reset"></A>IASPlayList::Reset</H2>

<P>This<B> </B>method resets the play list and turns off all active tracks.</P>

<H4>Syntax</H4>

<P><B>HRESULT Reset ( void );</B></P>

<H4>Return Values</H4>

<P>NOERROR indicates success. If an error occurs, the appropriate <B>HRESULT</B> value is returned.</P>
