<H2><A NAME="_wcesdk_wm_audsrcselect"></A>WM_AUDSRCSELECT</H2>

<P>This message is posted by the system to notify an application that an audio source has been selected. The application must implement a callback function to receive the message.</P>

<H4>Parameters</H4>

<DL>
<DT><I>wParam</I></DT>

<DD>Specifies the audio source identifier.</dd>

<DT><I>lParam</I> </DT>

<DD>Set to 0.
</dd>
</DL>

<P><A HREF="apc_msg_10.htm" TARGET="_top">WM_AUDSRCUNSELECT</A></P>
