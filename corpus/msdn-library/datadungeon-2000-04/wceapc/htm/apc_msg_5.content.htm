<H2><A NAME="_wcesdk_wm_apcsysmsg_mute"></A>WM_APCSYSMSG_MUTE</H2>

<P>This message is sent if the audio state is changed to muted or to non-muted.</P>

<H4>Parameters</H4>

<DL>
<DT><I>wParam</I></DT>

<DD>Reserved.</dd>

<DT><I>lParam</I></DT>

<DD>Set to TRUE if the audio state is changed to muted. Set to FALSE if the audio state is changed to non-muted.
</dd>
</DL>
