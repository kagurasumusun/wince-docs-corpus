<H2><A NAME="_wcesdk_iaseditbox_delete"></A>IASEditBox::Delete</H2>

<P>This<B> </B>method deletes the character currently selected for editing.</P>

<H4>Syntax</H4>

<P><B>HRESULT Delete( void );</B></P>

<H4>Return Values</H4>

<P>NOERROR indicates success. S_FALSE indicates that there is nothing to delete.</P>
