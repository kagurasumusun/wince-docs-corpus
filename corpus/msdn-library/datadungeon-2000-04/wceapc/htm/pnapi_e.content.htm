<H2><A NAME="_wcesdk_pn3state_t"></A>PN3State_t</H2>

<P>Enumerates a set of available modes</P>

<H4>Syntax</H4>

<P><B>typedef enum ePN3State_t{</B><BR>
PN_3S_FALSE = MIN_PNALTHOLD_T,<BR>
PN_3S_TRUE  = 1,<BR>
PN_3S_OTHER = MAX_PNALTHOLD_T<BR>
<B>}PN3State_t</B>;</P>

<H4>Members</H4>

<DL>
<DT>PN_3S_FALSE</DT>

<DD>Off, or FALSE position</dd>

<DT>PN_3S_TRUE</DT>

<DD>On, or TRUE position</dd>

<DT>PN_3S_OTHER</DT>

<DD>Other, or indeterminate position
</dd>
</DL>
