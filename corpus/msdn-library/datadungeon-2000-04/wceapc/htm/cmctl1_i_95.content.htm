<H2><A NAME="_wcesdk_iasimagemenu_put_id"></A>IASImageMenu::put_ID</H2>

<P>This<B> </B>method sets the identifier for a menu item.</P>

<H4>Syntax</H4>

<P><B>HRESULT put_ID( long </B><I>index,</I><B> short </B><I>wID</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>index</I></DT>

<DD>[in] Index of the item.</dd>

<DT><I>wID</I></DT>

<DD>[in] User-defined item identifier.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_INVALIDARG indicates that the argument is invalid.</P>
