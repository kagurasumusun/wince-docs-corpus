<H2><A NAME="_wcesdk_iapcspeech_destroyspkcontext"></A>IAPCSpeech::DestroySpkContext</H2>

<P>This method<B> </B>destroys a speak context.</P>

<H4>Syntax</H4>

<P><B>HRESULT IAPCSpeech::DestroySpkContext (</B> <B>DWORD </B><I>dwContext, </I><B>DWORD </B><I>dwFlag </I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>dwContext</I></DT>

<DD>Specifies the speech context.</dd>

<DT><I>dwFlag</I></DT>

<DD>Reserved; set to 0.
</dd>
</DL>

<H4>Return Values</H4>

<P>An appropriate <B>HRESULT</B> value is returned.</P>
