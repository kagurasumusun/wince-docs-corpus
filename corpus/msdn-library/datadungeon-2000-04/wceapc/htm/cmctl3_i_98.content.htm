<P><B>HRESULT put_ItemId( long </B><I>lItemId</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>lItemId</I></DT>

<DD>Long integer that contains the identifier of the item.
</dd>
</DL>

<H4>Return Values</H4>

<P>An appropriate <B>HRESULT</B> value is returned.</P>
