<H2><A NAME="_wcesdk_iastabber_speakfocustab"></A>IASTabber::SpeakFocusTab</H2>

<P>This method specifies which tab has focus, based on speech.</P>

<H4>Syntax</H4>

<P><B>HRESULT SpeakFocusTab( );</B></P>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_OUTOFMEMORY indicates that the system is out of memory.</P>
