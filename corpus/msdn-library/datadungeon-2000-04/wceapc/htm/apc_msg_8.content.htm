<P>This message is sent when the audio volume changes.</P>

<H4>Syntax</H4>

<P><B>WM_APCSYSMSG_VOLUMECHANGED </B><I>wParam</I> = <B>Reserved; </B><I>lParam</I> = <B>Reserved;</B></P>

<H4>Remarks</H4>

<P>This message does not currently take parameters.</P>
