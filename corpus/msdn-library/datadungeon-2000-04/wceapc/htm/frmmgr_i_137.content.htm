<H2><A NAME="_wcesdk_ifmmanage_fmstophelp"></A>IfmManage::fmStopHelp</H2>

<P>This method closes all help message boxes.</P>

<H4>Syntax</H4>

<P><B>HRESULT fmStopHelp(</B><I> </I><B>);</B></P>

<H4>Return Values</H4>

<P>S_OK indicates that the method successfully stopped Help. S_FALSE indicates that an error occurred.</P>
