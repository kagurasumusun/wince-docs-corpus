<H2><A NAME="_wcesdk_iaspowerlistboxstringspinner_put_value"></A>IASPowerListBoxStringSpinner::put_Value</H2>

<P>This method sets the string currently being displayed.</P>

<H4>Syntax</H4>

<P><B>HRESULT put_Value( BSTR </B><I>bstrValue</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>bstrValue</I></DT>

<DD>Unicode string to be displayed.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_OUTOFMEMORY indicates that the system is out of memory.</P>
