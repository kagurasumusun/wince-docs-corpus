<H2><A NAME="_wcesdk_iasimagemenu_removebyid"></A>IASImageMenu::RemoveByID</H2>

<P>This<B> </B>method removes an item specified by its identifier.</P>

<H4>Syntax</H4>

<P><B>HRESULT RemoveByID( short </B><I>wID</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>wID</I></DT>

<DD>[in] User-defined image identifier.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_INVALIDARG indicates that the argument is invalid.</P>
