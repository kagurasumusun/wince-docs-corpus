<H2><A NAME="_wcesdk_ifmmanage_fmstopmessagebox"></A>IfmManage::fmStopMessageBox</H2>

<P>This method closes the message box for an application if one is currently displayed.</P>

<H4>Syntax</H4>

<P><B>HRESULT fmStopMessageBox(</B><I> </I><B>);</B></P>

<H4>Return Values</H4>

<P>S_OK indicates that the method successfully closed the message box. S_FALSE indicates that an error occurred.</P>
