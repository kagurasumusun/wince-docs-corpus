<H2><A NAME="_wcesdk_iasimagemenu_removeatindex"></A>IASImageMenu::RemoveAtIndex</H2>

<P>This<B> </B>method removes an item specified by its index.</P>

<H4>Syntax</H4>

<P><B>HRESULT RemoveAtIndex( long </B><I>index</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>index</I></DT>

<DD>[in] Index of the item to be removed.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_INVALIDARG indicates that the argument is invalid.</P>
