<H2><A NAME="_wcesdk_ifmmanage_get_menutitlebar"></A>IfmManage::get_MenuTitlebar</H2>

<P>This method gets the title bar menu. </P>

<H4>Syntax</H4>

<P><B>HRESULT get_MenuTitlebar(</B> <B>IASTitlebar </B><I>**ppTitlebar </I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>ppTitlebar</I></DT>

<DD>Pointer to a pointer to a title bar.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. If an error occurs, the appropriate <B>HRESULT</B> value is returned.</P>
