<H2><A NAME="_wcesdk_iastabber_put_voicemenu"></A>IASTabber::put_VoiceMenu</H2>

<P>This method sets a voice menu for the tabber.</P>

<H4>Syntax</H4>

<P><B>HRESULT put_VoiceMenu( IVCmdMenu </B><I>*pVoiceMenu</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>pVoiceMenu</I></DT>

<DD>Pointer to the voice menu.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_OUTOFMEMORY indicates that the system is out of memory.</P>
