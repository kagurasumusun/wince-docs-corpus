<H2><A NAME="_wcesdk_uninitasformsmanager"></A>UnInitASFormsManager</H2>

<P>This function<B> </B>uninitializes a Forms Manager.</P>

<H4>Syntax</H4>

<P><B>HRESULT UnInitASFormsManager( void );</B></P>

<H4>Return Values</H4>

<P>Returns the appropriate HRESULT.</P>

<H4>Remarks</H4>

<P>Call this function after objects are released and prior to exiting the application.</P>
