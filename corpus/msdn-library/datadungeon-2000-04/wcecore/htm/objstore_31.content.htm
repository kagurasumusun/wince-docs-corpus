<H2><A NAME="_wcesdk_reading_a_registry_key_or_value"></A>Reading a Registry Key or Value</H2>

<P>Use the <B>RegQueryValueEx </B>function to read a specified value from the registry. You can also use <B>RegQueryInfoKey</B> to receive data about a specified key. </P>
