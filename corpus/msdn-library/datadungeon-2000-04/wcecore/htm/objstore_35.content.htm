<H2><A NAME="_wcesdk_closing_the_registry"></A>Closing the Registry</H2>

<P>Once you are done with a registry key, close the key with a call to the <B>RegCloseKey</B> function. Calling <B>RegCloseKey</B> instructs Windows CE to flush any unwritten data to the key before closing the key.</P>
