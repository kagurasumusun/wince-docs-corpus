<H1><A NAME="_wcesdk_mobile_channels_chr"></A>Chr</H1>

<P>This function converts an ASCII numeric value to the associated character and returns a string expression of one character.</P>

<P class=blue><B>Syntax</B></P>

<P><CODE><B>Chr(</B><I>numericExpression</I><B>)</B></CODE></P>

<P class=blue><B>Example</B></P>

<P>The following code example shows how to create a string containing one new line character.</P>

<PRE><CODE>str = Chr(10)
</CODE></PRE>
