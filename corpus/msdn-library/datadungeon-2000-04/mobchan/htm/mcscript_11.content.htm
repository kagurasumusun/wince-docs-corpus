<H1><A NAME="_wcesdk_mobile_channels_len"></A>Len</H1>

<P>This function returns the length of a string.</P>

<P class=blue><B>Syntax</B></P>

<P><CODE><B>Len(</B>&lt;<I>string</I>&gt;<B>)</B></CODE></P>

<P class=blue><B>Example</B></P>

<P>The following code example returns 6.</P>

<PRE><CODE>Len("Hello?") 
</CODE></PRE>
