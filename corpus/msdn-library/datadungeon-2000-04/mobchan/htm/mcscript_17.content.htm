<H1><A NAME="_wcesdk_mobile_channels_random"></A>Random</H1>

<P>The function generates a random number in the range from 0 through -1.</P>

<P class=blue><B>Syntax</B></P>

<P><CODE><B>Random(</B><I>range</I><B>)</B></CODE></P>

<P class=blue><B>Example</B></P>

<P>The following code example generates random numbers from 0 through 9 inclusive.</P>

<PRE><CODE>num = Random(10)
</CODE></PRE>
