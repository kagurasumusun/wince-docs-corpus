<H1><A NAME="_wcesdk_mobile_channels_locate"></A>Locate</H1>

<P>This method is a shorthand for the “Jump” action of the <B>Navigate</B> method, which has the following form:</P>

<PRE><CODE>newElem = MC.Navigate("", "Jump", "ID")
</CODE></PRE>

<P class=blue><B>Syntax</B></P>

<P><CODE><I>MC</I>.<B>Locate(</B><I>“ID”</I><B>)</B></CODE></P>

<P class=blue><B>Example</B></P>

<PRE><CODE>newElem = MC.Locate("ID")
</CODE></PRE>

</BODY>
