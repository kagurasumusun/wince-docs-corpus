<H1><A NAME="_wcesdk_mobile_channels_comments"></A>Comments</H1>

<P>Comments are started with the single quote (‘) and may appear anywhere on a line. The VBScript <B>REM</B> keyword for comments is not supported for Mobile Channels scripting. The following code example shows a Mobile Channels comment.</P>

<PRE><CODE>' This is an example comment.
</CODE></PRE>
