<H1><A NAME="_wcesdk_mobile_channels_asc"></A>Asc</H1>

<P>This function converts a character string into its numeric ASCII value and returns an numeric expression. If the <I>aStringExpression</I> is longer than one character, the function returns the ASCII value of the first character only.</P>

<P class=blue><B>Syntax</B></P>

<P><CODE><B>Asc(</B><I>aStringExpression</I><B>)</B></CODE></P>
