<H1><A NAME="_wcesdk_mobile_channels_debugging_scripts"></A>Debugging Scripts</H1>

<P>You want to debug your script using an effective tool.</P>

<P class=dt><B>Resolution</B></P>

<P class=indent>Use a debugger such as DBWin32 and place <I>MC</I><B>.Debug</B> statements at strategic points in your script. For more information about <I>MC</I><B>.Debug</B>, see <A HREF="mcscript.htm" TARGET="_top">Mobile Channels Scripting Reference</A>. </P>
