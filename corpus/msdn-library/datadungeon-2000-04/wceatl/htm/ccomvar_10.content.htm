<H1><A NAME="_vcce_ccomvariant_operators"></A>CComVariant Operators</H1>

<TABLE border=1 cellpadding=5 cols=2 frame=below rules=rows>

<TR VALIGN="top">
<TD class=blue width=16%><B>Operator</B></TD>
<TD class=blue width=84%><B>Description</B></TD>
</TR>

<TR VALIGN="top">
<TD width=16%><A HREF="ccomvar_11.htm" TARGET="_top">operator =</A></TD>
<TD width=84%>Assigns a value to the <B>CComVariant</B> object.</TD>
</TR>

<TR VALIGN="top">
<TD width=16%><A HREF="ccomvar_12.htm" TARGET="_top">operator ==</A></TD>
<TD width=84%>Indicates whether the <B>CComVariant</B> object equals the specified <B>VARIANT</B>.</TD>
</TR>

<TR VALIGN="top">
<TD width=16%><A HREF="ccomvar_13.htm" TARGET="_top">operator !=</A></TD>
<TD width=84%>Indicates whether the <B>CComVariant</B> object does not equal the specified <B>VARIANT</B>.</TD>
</TR>
</TABLE><BR>
