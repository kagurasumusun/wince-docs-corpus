<H1><A NAME="_vcce_ccombstr_operators"></A>CComBSTR Operators</H1>

<TABLE border=1 cellpadding=5 cols=2 frame=below rules=rows>

<TR VALIGN="top">
<TD class=blue width=20%><B>Operator</B></TD>
<TD class=blue width=80%><B>Description</B></TD>
</TR>

<TR VALIGN="top">
<TD width=20%><A HREF="ccbstr_13.htm" TARGET="_top">operator BSTR</A></TD>
<TD width=80%>Converts a <B>CComBSTR</B> object to a <B>BSTR</B>.</TD>
</TR>

<TR VALIGN="top">
<TD width=20%><A HREF="ccbstr_14.htm" TARGET="_top">Operator =</A></TD>
<TD width=80%>Assigns a value to <B>m_str</B>.</TD>
</TR>

<TR VALIGN="top">
<TD width=20%><A HREF="ccbstr_15.htm" TARGET="_top">Operator +=</A></TD>
<TD width=80%>Appends a <B>CComBSTR</B> to the object.</TD>
</TR>

<TR VALIGN="top">
<TD width=20%><A HREF="ccbstr_16.htm" TARGET="_top">Operator &amp;</A></TD>
<TD width=80%>Returns the address of <B>m_str</B>.</TD>
</TR>

<TR VALIGN="top">
<TD width=20%><A HREF="ccbstr_17.htm" TARGET="_top">Operator !</A></TD>
<TD width=80%>Returns <B>TRUE</B> or <B>FALSE</B>, depending on whether <B>m_str</B> is <B>NULL</B>.</TD>
</TR>
</TABLE><BR>
