<H2><A NAME="_vcce_control_support_classes"></A>Control Support Classes</H2>

<P><IMG SRC="ctrlsupp.gif" ALT="" BORDER=0></P>

<P>MFC for Windows CE supports the <A HREF="cimaglst.htm" TARGET="_top"><B>CImageList</B></A> class the same way standard MFC does, and it does not support the <B>CDockState </B>class at all.</P>

<P>For information about where the <B>CImageList</B> class fits into the Windows CE class hierarchy, see <A HREF="mfc_9.htm" TARGET="_top">Classes Derived from <B>CObject</B></A>.</P>
