<H2><A NAME="_wcesdk_win32_getdoubleclicktime"></A>GetDoubleClickTime</H2>

<P>This function retrieves the current double-click time for the stylus. </P>

<H4>At a Glance</H4>

<TABLE cellspacing=4 cols=2>

<TR VALIGN="top">
<TD width=33%>Header file:</TD>
<TD width=67%>Winuser.h</TD>
</TR>

<TR VALIGN="top">
<TD width=33%>Windows CE versions:</TD>
<TD width=67%>1.0 and later</TD>
</TR>
</TABLE><BR>

<H4>Syntax</H4>

<P><B>UINT GetDoubleClickTime(void);</B></P>

<H4>Return Values</H4>

<P>The return value specifies the current double-click time, in milliseconds. </P>
