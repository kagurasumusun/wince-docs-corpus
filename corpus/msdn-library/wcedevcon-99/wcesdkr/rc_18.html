<H2><A NAME="_wcesdk_win32_static_control_statements"></A>Static Control Statements</H2>

<H4>Syntax</H4>

<P><B>staticClass</B> <I>controlText</I>, <I>id</I></P>

<H4>Parameters</H4>

<DL>
<DT><I>staticClass </I></DT>

<DD>Specifies one of the following classes: <B>LTEXT</B>, <B>RTEXT</B>, or <B>CTEXT</B>.</dd>

<DT><I>controlText</I></DT>

<DD>Specifies the window text for the control.</dd>

<DT><I>id</I></DT>

<DD>Specifies the control identifier.
</dd>
</DL>
