<H2><A NAME="_wcesdk_win32_udm_getbuddy"></A>UDM_GETBUDDY</H2>

<P>This message retrieves the handle of the current buddy window. </P>

<H4>At a Glance</H4>

<TABLE cellspacing=4 cols=2>

<TR VALIGN="top">
<TD width=33%>Header file:</TD>
<TD width=67%>Commctrl.h</TD>
</TR>

<TR VALIGN="top">
<TD width=33%>Windows CE versions:</TD>
<TD width=67%>1.0 and later</TD>
</TR>
</TABLE><BR>

<H4>Syntax</H4>

<P><B>UDM_GETBUDDY </B><I>wParam</I> = 0; <I>lParam</I> = 0;</P>

<H4>Return Values</H4>

<P>The handle to the current buddy window indicates success. </P>

<P><A HREF="uim_uw_8.htm">UDM_SETBUDDY</A></P>
