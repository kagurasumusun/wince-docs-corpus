<H2><A NAME="_wcesdk_rb_getbarheight"></A>RB_GETBARHEIGHT</H2>

<P>This message retrieves the height the rebar control.</P>

<H4>At a Glance</H4>

<TABLE cellspacing=4 cols=2>

<TR VALIGN="top">
<TD width=33%>Header file:</TD>
<TD width=67%>Commctrl.h</TD>
</TR>

<TR VALIGN="top">
<TD width=33%>Windows CE versions:</TD>
<TD width=67%>2.0 and later</TD>
</TR>
</TABLE><BR>

<H4>Syntax</H4>

<P><B>RB_GETBARHEIGHT </B><I>wParam</I> = 0; <I>lParam</I> = 0;</P>

<H4>Return Values</H4>

<P>Returns a <B>UINT</B> value that represents the height, in pixels, of the control. </P>
