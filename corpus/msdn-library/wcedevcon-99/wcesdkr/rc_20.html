<H2><A NAME="_wcesdk_win32_edit_control_statements"></A>Edit Control Statements</H2>

<H4>Syntax</H4>

<P><B>editClass</B> <I>id</I>

<DL>
<DT><I>editClass </I></DT>

<DD>Specifies one of the following classes: <B>EDITTEXT</B>, <B>BEDIT</B>, <B>HEDIT</B>, or <B>IEDIT</B>. </dd>

<DT><I>id</I></DT>

<DD>Specifies the control identifier. 
</dd>
</DL>
