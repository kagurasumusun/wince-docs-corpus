<H2><A NAME="_wcesdk_dtm_selectall"></A>DTM_SELECTALL</H2>

<P>This message is sent by an application to tell an HTML viewer control to select all the text in the current HTML page.</P>

<H4>At a Glance</H4>

<TABLE cellspacing=4 cols=2>

<TR VALIGN="top">
<TD width=30%>Header file:</TD>
<TD width=70%>Htmlctrl.h</TD>
</TR>

<TR VALIGN="top">
<TD width=30%>Windows CE versions:</TD>
<TD width=70%>1.0 and later</TD>
</TR>
</TABLE><BR>

<H4>Syntax </H4>

<P><B>DTM_SELECTALL </B><I>wParam</I> = 0; <I>lParam</I> = 0;</P>

<H4>Return Values </H4>

<P>None.</P>
