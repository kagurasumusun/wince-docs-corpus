<H2><A NAME="_wcesdk_tb_getstyle"></A>TB_GETSTYLE</H2>

<P>This message retrieves the styles currently in use for a toolbar control. </P>

<H4>At a Glance</H4>

<TABLE cellspacing=4 cols=2>

<TR VALIGN="top">
<TD width=33%>Header file:</TD>
<TD width=67%>Commctrl.h</TD>
</TR>

<TR VALIGN="top">
<TD width=33%>Windows CE versions:</TD>
<TD width=67%>2.0 and later</TD>
</TR>
</TABLE><BR>

<H4>Syntax</H4>

<P><B>TB_GETSTYLE </B><I>wParam</I> = 0; <I>lParam</I> = 0;</P>

<H4>Return Values</H4>

<P>Returns a <B>DWORD</B> value that is a combination of toolbar control styles. </P>
