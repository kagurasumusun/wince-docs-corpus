<H2><A NAME="_wcesdk_navigation_controls"></A>Navigation Controls</H2>

<P>Windows CE supports the following navigation controls for accessing and manipulating applications on a Palm-size PC:

<UL>
	<LI>Buttons</li>

	<LI>Wheels</li>

	<LI>Silkscreen regions</li>

	<LI>Input devices other than a touch screen</li>
</UL>

<P>This section explains how you can program these controls.</P>
