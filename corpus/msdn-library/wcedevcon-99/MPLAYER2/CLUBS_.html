<h1>CLUBS_</h1>
<p>Specifies whether the Navigation bar is visible in the player window when you use this view. The Navigation bar includes Back and Forward buttons so you can easily play media files you played earlier in a session, and a Web Events button that provides access to a wide range of media files.</p>
