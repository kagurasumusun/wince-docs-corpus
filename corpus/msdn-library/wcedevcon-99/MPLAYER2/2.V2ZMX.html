<h1>Changing what appears in the player window</h1>
<p>To change what appears in the player window</p>
<p>1	On the View menu, click Options.</p>
<p>2	Click the Custom Views tab.</p>
<p>3	Click the components you want in the Compact and Minimal views.</p>
