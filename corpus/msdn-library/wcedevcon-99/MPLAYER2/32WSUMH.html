<h1>Playing a media file repeatedly</h1>
<p>To play a media file repeatedly</p>
<p>1	On the View menu, click Options.</p>
<p>2	On the Playback tab, click Play, and then type the number of times you want to play files.</p>
<p>To play a file repeatedly until you stop the playback or close Media Player, click Repeat forever.</p>
