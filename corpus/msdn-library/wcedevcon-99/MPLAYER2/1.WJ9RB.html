<h1>1.WJ9RB</h1>
<p>Lists the markers in a clip. Like chapters in a book, markers define sections of the clip. The Time column indicates when each section begins, as the number of minutes and seconds into the clip.</p>
<p>Select the marker at which you want to begin playing the clip.</p>
