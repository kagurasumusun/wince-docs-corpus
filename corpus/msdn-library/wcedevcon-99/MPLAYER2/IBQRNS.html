<h1>IBQRNS</h1>
<p>Lists the codecs that are in use for the clip that is playing. A codec (derived from the words compressor/decompressor) is a scheme used to compress media content when it is sent and decompress it when it is received. A codec enables rapid transmittal of media content.</p>
