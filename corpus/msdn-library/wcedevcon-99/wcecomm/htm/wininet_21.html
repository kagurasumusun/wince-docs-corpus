<H2><A NAME="_wcesdk_generating_a_cookie_using_the_dhtml_object_model"></A>Generating a Cookie Using the DHTML Object Model</H2>

<P>Using the DHTML object model, cookies can be set by calling the cookie property of the document object, as shown in the following code example.</P>

<PRE><CODE>&lt;SCRIPT language="JavaScript"&gt;
&lt;!--
    document.cookie = "SomeValueName = Some_Value";
--&gt;
&lt;/SCRIPT&gt;
</CODE></PRE>
