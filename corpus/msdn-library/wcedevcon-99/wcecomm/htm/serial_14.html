<H2><A NAME="_wcesdk_closing_a_serial_port"></A>Closing a Serial Port</H2>

<P>Call the <A HREF="JavaScript:hhobj_1.Click()"><B>CloseHandle</B></A> function to close a serial port when an application is done using it. <B>CloseHandle</B> has one parameter, which is the handle returned by the <A HREF="JavaScript:hhobj_2.Click()"><B>CreateFile</B></A> function call that opened the port.</P>
