<H2><A NAME="_wcesdk_http_cookies"></A>HTTP Cookies</H2>

<P>HTTP cookies provide the server with a mechanism to store and retrieve state data on the client application’s system. This mechanism enables Web-based applications to store data about selected items, user preferences, registration data, and other data that can be retrieved later.</P>
