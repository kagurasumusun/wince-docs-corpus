<H2><A NAME="_wcesdk_iaspowerlistbox_removeall"></A>IASPowerListBox::RemoveAll</H2>

<P>This<B> </B>method removes all items from the power list box.</P>

<H4>Syntax</H4>

<P><B>HRESULT RemoveAll( void );</B></P>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_OUTOFMEMORY indicates that the system is out of memory.</P>
