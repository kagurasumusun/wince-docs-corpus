<H2><A NAME="_wcesdk_iasimagemenu_get_count"></A>IASImageMenu::get_Count</H2>

<P>This<B> </B>method gets the number of items in the menu.</P>

<H4>Syntax</H4>

<P><B>HRESULT get_Count( long </B><I>*pcItems</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>pcItems</I></DT>

<DD>[out] Pointer to the number of items.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_INVALIDARG indicates that the argument is invalid.</P>
