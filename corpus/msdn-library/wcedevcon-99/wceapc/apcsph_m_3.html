<H2><A NAME="_wcesdk_wm_spch_snddone"></A>WM_SPCH_SNDDONE</H2>

<P>This message notifies the application of that a sound has finished.</P>

<P><I>wParam</I> is always zero.</P>

<P><I>lParam</I> is the sound ID passed into the <B>PlaySound</B> function.</P>
