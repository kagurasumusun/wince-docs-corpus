<H2><A NAME="_wcesdk_tunerreset"></A>TunerReset</H2>

<P>This function resets the tuner to the default driver settings.</P>

<H4>Syntax</H4>

<P><B>BOOL TunerReset( HANDLE </B><I>hTuner</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>hTuner</I></DT>

<DD>[in] Handle to the current tuner, as returned by <B>TunerOpen</B>.
</dd>
</DL>

<H4>Return Values</H4>

<P>TRUE indicates success. FALSE indicates failure.</P>

<H4>See Also</H4>

<P><A HREF="tuner_f_6.htm"><B>TunerOpen</B></A><B> </B></P>
