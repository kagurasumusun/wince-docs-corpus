<H2><A NAME="_wcesdk_obtaining_vehicle_data"></A>Obtaining Vehicle Data</H2>

<P>The vehicle I/O API enables you to write applications that obtain data from a vehicle’s on-board computers and present that data to the driver. You can write diagnostic, maintenance, and other informational applications.</P>
