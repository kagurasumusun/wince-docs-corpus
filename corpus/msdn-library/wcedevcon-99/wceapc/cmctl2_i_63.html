<H2><A NAME="_wcesdk_iascharspinner_put_curchar"></A>IASCharSpinner::put_CurChar</H2>

<P>This method sets the current character.</P>

<H4>Syntax</H4>

<P><B>HRESULT put_CurChar( short </B><I>ch</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>ch</I></DT>

<DD>Current character.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_INVALIDARG indicates that an invalid argument has been entered.</P>

<P><A HREF="cmctl2_i_62.htm"><B>IASCharSpinner::get_CurChar</B></A></P>
