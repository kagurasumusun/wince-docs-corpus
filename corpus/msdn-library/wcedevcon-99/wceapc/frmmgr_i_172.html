<H2><A NAME="_wcesdk_ifmmanage_stopall"></A>IfmManage::StopAll</H2>

<P>This method removes the registration from all of the forms for an application from the Forms Manager.</P>

<H4>Syntax</H4>

<P><B>HRESULT StopAll(</B> <B>void );</B></P>

<H4>Return Values</H4>

<P>NOERROR indicates success. If an error occurs, the appropriate <B>HRESULT</B> value is returned.</P>

<P><A HREF="frmmgr_i_171.htm"><B>IfmManage::Stop</B></A></P>
