<H2><A NAME="_wcesdk_com"></A>Com</H2>

<P>This tag enables an application to embed a comment in the string to be spoken. The TTS engine ignores the embedded comment.</P>

<H4>Syntax</H4>

<P>\<B>Com</B>=<I>string</I>\ </P>

<H4>Example</H4>

<P>“The following comment \<B>Com</B>=“This is a comment”\ is ignored by the TTS engine.”</P>
<p>&nbsp;</p></body>
