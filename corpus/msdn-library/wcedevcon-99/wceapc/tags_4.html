<H2><A NAME="_wcesdk_pau"></A>Pau</H2>

<P>This tag pauses speech for a specified number of milliseconds.</P>

<H4>Syntax</H4>

<P>\<B>Pau</B>=<I>pause</I>\</P>

<H4>Parameters</H4>

<DL>
<DT><I>pause</I></DT>

<DD>Number of milliseconds to pause.
</dd>
</DL>

<H4>Example</H4>

<P>“This TTS sentence \<B>Pau</B>=1000\ pauses for one second.”</P>
<p>&nbsp;</p></body>
