<H2><A NAME="_wcesdk_iascanvas_commit"></A>IASCanvas::Commit</H2>

<P>This<B> </B>method sends the current contents of the device context (DC) to the screen.</P>

<H4>Syntax</H4>

<P><B>HRESULT Commit( void );</B></P>

<H4>Return Values</H4>

<P>NOERROR indicates success. If an error occurs, the appropriate <B>HRESULT</B> value is returned.</P>
