<H2><A NAME="_wcesdk_spd"></A>Spd</H2>

<P>This tag sets the baseline average talking speed of the TTS output.</P>

<H4>Syntax</H4>

<P>\<B>Spd</B>=<I>number</I>\</P>

<H4>Parameter</H4>

<DL>
<DT><I>number</I></DT>

<DD>Specifies the baseline average talking speed, in words per minute.
</dd>
</DL>

<H4>Example</H4>

<P>\<B>Spd</B>=120\</P>

<H4>Remarks</H4>

<P>The actual rate of speech fluctuates, but this tag changes the average rate.</P>
<p>&nbsp;</p></body>
