<H2><A NAME="_wcesdk_iastabber_get_count"></A>IASTabber::get_Count</H2>

<P>This method retrieves the number of tabs.</P>

<H4>Syntax</H4>

<P><B>HRESULT get_Count( long </B><I>*pcItems</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>pcItems</I></DT>

<DD>Pointer to the number of tabs.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_OUTOFMEMORY indicates that the system is out of memory.</P>
