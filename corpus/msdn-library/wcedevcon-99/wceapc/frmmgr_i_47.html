<H2><A NAME="_wcesdk_iascontrol_isstarted"></A>IASControl::IsStarted</H2>

<P>This method checks to see if the control has been started.</P>

<H4>Syntax</H4>

<P><B>HRESULT IsStarted(</B> <B>void );</B></P>

<H4>Return Values</H4>

<P>NOERROR indicates that the control has been started. S_FALSE indicates that the control has not been started.</P>
