<H2><A NAME="_wcesdk_wm_spch_recog"></A>WM_SPCH_RECOG</H2>

<P>This message is sent when a phrase is recognized.</P>

<H4>Remarks</H4>

<P>The <I>lParam</I> contains the command identifier of the phrase that is recognized.</P>

<P>If the application called <B>AddVMenuCommand</B> with a user-defined <B>DWORD</B>, the <I>wParam</I> will be that <B>DWORD</B>. Otherwise it is zero.</P>
