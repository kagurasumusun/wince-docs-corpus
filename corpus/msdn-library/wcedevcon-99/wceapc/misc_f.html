<H2><A NAME="_wcesdk_initasformsmanager"></A>InitASFormsManager</H2>

<P>This function<B> </B>initializes a Forms Manager.</P>

<H4>Syntax</H4>

<P><B>HRESULT InitASFormsManager( void );</B></P>

<H4>Return Values</H4>

<P>Returns the appropriate HRESULT.</P>

<H4>Remarks</H4>

<P>Call this function prior to creating any forms or Forms Managers.</P>

<P><A HREF="misc_f_1.htm"><B>UnInitASFormsManager</B></A></P>
