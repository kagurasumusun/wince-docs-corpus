<H2><A NAME="_wcesdk_iasform_get_count"></A>IASForm::get_Count</H2>

<P>This method gets the number of controls on a form.</P>

<H4>Syntax</H4>

<P><B>HRESULT get_Count(</B> <B>long</B> <I>*pcItems</I> <B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>pcItems</I></DT>

<DD>Pointer to the number of controls on the form.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. If an error occurs, the appropriate <B>HRESULT</B> value is returned.</P>
