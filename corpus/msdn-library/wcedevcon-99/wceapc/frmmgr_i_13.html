<H2><A NAME="_wcesdk_iasactiveforms_setfocus"></A>IASActiveForms::SetFocus</H2>

<P>This method sets the focus to a specified form.</P>

<H4>Syntax</H4>

<P><B>HRESULT SetFocus(</B> <B>IDispatch</B><I>*pdispForm </I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>pdispForm</I></DT>

<DD>Pointer to the pointer to the form.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. If an error occurs, the appropriate <B>HRESULT</B> value is returned.</P>
