<H2><A NAME="_wcesdk_iascharspinner_put_charset"></A>IASCharSpinner::put_CharSet</H2>

<P>This method sets the character set.</P>

<H4>Syntax</H4>

<P><B>HRESULT put_CharSet( BSTR </B><I>bstr</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>bstr</I></DT>

<DD>Character set.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_INVALIDARG indicates that an invalid argument has been entered.</P>

<P><A HREF="cmctl2_i_60.htm"><B>IASCharSpinner::get_CharSet</B></A></P>
