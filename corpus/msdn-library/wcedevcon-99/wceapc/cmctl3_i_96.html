<H2><A NAME="_wcesdk_iaspowerlistboxitem_put_caption"></A>IASPowerListBoxItem::put_Caption</H2>

<P>This method sets the item caption.</P>

<H4>Syntax</H4>

<P><B>HRESULT put_Caption( BSTR </B><I>bstrCaption</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>bstrCaption</I></DT>

<DD>Unicode string to be displayed as the caption.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_OUTOFMEMORY indicates that the system is out of memory.</P>
