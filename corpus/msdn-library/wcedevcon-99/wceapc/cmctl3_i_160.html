<H2><A NAME="_wcesdk_iashtmlcontrol_jumptoanchor"></A>IASHTMLControl::JumpToAnchor</H2>

<P>This<B> </B>method jumps to an anchor elsewhere in the document.</P>

<H4>Syntax</H4>

<P><B>HRESULT JumpToAnchor ( BSTR </B><I>bstrAnchor</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>bstrAnchor</I></DT>

<DD>HTML-formatted string that identifies the anchor.
</dd>
</DL>

<H4>Return Values</H4>

<P>An appropriate <B>HRESULT</B> value is returned.</P>
