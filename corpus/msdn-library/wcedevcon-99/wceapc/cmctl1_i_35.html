<H2><A NAME="_wcesdk_iascrosshairs_put_yminus"></A>IASCrossHairs::put_YMinus</H2>

<P>This<B> </B>method sets the minimum value of the y-axis.</P>

<H4>Syntax</H4>

<P><B>HRESULT put_YMinus( short </B><I>wVal </I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>wval</I></DT>

<DD>[in] Minimum value of the y-axis.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. If an error occurs, the appropriate <B>HRESULT</B> value is returned.</P>
