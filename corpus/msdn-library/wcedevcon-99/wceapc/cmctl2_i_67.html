<H2><A NAME="_wcesdk_iascharspinner_prevchar"></A>IASCharSpinner::PrevChar</H2>

<P>This method retracts the position of the spin box to the previous character.</P>

<H4>Syntax</H4>

<P><B>HRESULT PrevChar( );</B></P>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_INVALIDARG indicates that an invalid argument has been entered.</P>

<P><A HREF="cmctl2_i_66.htm"><B>IASCharSpinner::NextChar</B></A></P>
