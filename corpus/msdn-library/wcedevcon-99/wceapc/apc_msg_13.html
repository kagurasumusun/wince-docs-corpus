<H2><A NAME="_wcesdk_wm_querykeyusage"></A>WM_QUERYKEYUSAGE</H2>

<P>This message is posted by a NavArrow control to determine the keys that the sink for an application or a form can process.</P>

<H4>Parameters</H4>

<DL>
<DT><I>wParam</I></DT>

<DD>Unused.</dd>

<DT><I>lParam</I> </DT>

<DD>Contains a pointer to an <B>IQueryKeyUsage</B> interface.
</dd>
</DL>
