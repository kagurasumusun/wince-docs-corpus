<H2><A NAME="_wcesdk_iaseditbox_put_text"></A>IASEditBox::put_Text</H2>

<P>This method replaces the current text string with another.</P>

<H4>Syntax</H4>

<P><B>HRESULT put_Text( BSTR </B><I>bstr</I><B> );</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>bstr</I></DT>

<DD>[in] Unicode string.
</dd>
</DL>

<H4>Return Values</H4>

<P>NOERROR indicates success. E_INVALIDARG indicates that the argument is invalid.</P>
