<H2><A NAME="_wcesdk_deleting_a_registry_key_or_value"></A>Deleting a Registry Key or Value</H2>

<P>Call the <B>RegDeleteKey</B> or <B>RegDeleteValue</B> function to delete registry keys and values, respectively. The key must be closed before you can properly delete it.</P>
