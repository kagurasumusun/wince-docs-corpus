<H2><A NAME="_wceddk_pdcardresetsocket"></A>PDCardResetSocket</H2>

<P>This function resets the specified socket.</P>

<H4>Syntax</H4>

<P><B>STATUS PDCardResetSocket(UINT32</B> <I>uSocket</I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>uSocket</I></DT>

<DD>Specifies the number indicating the socket. The first socket is 0.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns one of the CERR_* return codes in the Cardserv.h header file.</P>
