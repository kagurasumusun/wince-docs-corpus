<H2><A NAME="_wceddk_wav_deinit"></A>WAV_Deinit</H2>

<P>This function deinitializes the WAV I/O device.</P>

<H4>Syntax</H4>

<P><B>PVOID WAV_Deinit(DWORD</B> <I>dwData</I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>dwData</I></DT>

<DD>Specifies a value returned from a call to the <B>WAV_Init</B> function.
</dd>
</DL>

<H4>Return Values</H4>

<P>TRUE indicates success. FALSE indicates failure.</P>
