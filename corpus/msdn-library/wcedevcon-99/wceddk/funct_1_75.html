<H2><A NAME="_wceddk_dsk_deinit"></A>DSK_Deinit</H2>

<P>This function calls the <B>CardReleaseWindow</B> function for all mapped windows. It then calls the <B>CardDeregisterClient </B>function to free the client context.</P>
