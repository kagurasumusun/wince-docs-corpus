<H2><A NAME="_wceddk_ddsitouchpanelenable"></A>DdsiTouchPanelEnable</H2>

<P>This function applies power to the touch screen device and initializes it for operation.</P>

<H4>Syntax</H4>

<P><B>BOOL DdsiTouchPanelEnable(void);</B></P>

<H4>Return Values</H4>

<P>TRUE indicates success. FALSE indicates failure.</P>

<H4>Remarks</H4>

<P>This function supports the implementation of the touch screen driver.</P>
