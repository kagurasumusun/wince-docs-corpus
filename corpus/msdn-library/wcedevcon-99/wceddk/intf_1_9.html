<H2><A NAME="_wceddk_gpe_nummodes"></A>GPE::NumModes</H2>

<P>This method returns the number of display modes supported by a driver. A simple implementation is to return 1.</P>

<H4>Syntax</H4>

<P><B>virtual int NumModes(); </B></P>

<H4>Return Values</H4>

<P>Returns the number of display modes supported by a driver.</P>
