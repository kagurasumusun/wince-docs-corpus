<H2><A NAME="_wceddk_dsk_iocontrol"></A>DSK_IOControl</H2>

<P>This function responds to file allocation table (FAT) requests to read and write data; get media information, such as geometry; set media information; get device names; and perform low-level formatting operations.</P>
