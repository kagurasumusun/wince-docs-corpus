<H2><A NAME="_wceddk_using_1_bit_per_pixel"></A>Using 1 Bit per Pixel</H2>

<P>The 1-bpp format is for simple black-and-white displays. Black is represented by 0, and white is represented by 1. Pixel (0,0) is packed into the highest-order bit of the first byte of display memory. The following illustration shows the arrangement of memory for the format.</P>
