<H2><A NAME="_wceddk_wav_powerup"></A>WAV_PowerUp</H2>

<P>This function notifies the WAV I/O device that the system is leaving the suspend state.</P>

<H4>Syntax</H4>

<P><B>void WAV_PowerUp(void);</B></P>

<H4>Remarks</H4>

<P>This function is called to notify the WAV I/O device that the system is leaving suspend mode.</P>
