<H2><A NAME="_wceddk_surface_allocation"></A>Surface Allocation</H2>

<P>Display drivers allocate surfaces at initialization time for the video frame buffer, and possibly the cursor, when the GDI calls the <B>DrvCreateDeviceBitmap</B> function. <B>GPE::AllocSurface</B>, a required method, implements surface allocation within the driver.</P>
