<H2><A NAME="_wceddk_wav_init"></A>WAV_Init</H2>

<P>This function initializes the WAV I/O device.</P>

<H4>Syntax</H4>

<P><B>PVOID WAV_Init(DWORD</B> <I>dwInfo</I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>dwInfo</I></DT>

<DD>Specifies information passed to the <B>RegisterDevice</B> function.
</dd>
</DL>

<H4>Return Values</H4>

<P>Returns a <B>DWORD</B> which is passed to the <B>Wav_Open</B> and <B>Wav_ Deinit</B> functions. NULL indicates failure.</P>
