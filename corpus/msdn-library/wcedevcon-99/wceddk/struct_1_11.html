<H2><A NAME="_wceddk_card_event"></A>CARD_EVENT</H2>

<P>This type is used for event values in a registered driver callback function. Card Services calls the callback function when an associated PC Card event occurs.</P>

<H4>Syntax</H4>

<P><B>typedef UINT32 CARD_EVENT;</B></P>
