<H2><A NAME="_wceddk_printerclose"></A>PrinterClose</H2>

<P>Closes a printer handle previously opened by a call to the <A HREF="funct_1_340.htm"><B>PrinterOpen</B></A> function.</P>

<H4>Syntax</H4>

<P><B>VOID WINAPI PrinterClose(HANDLE </B><I>hPrint</I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>hPrint</I></DT>

<DD>Handle to a printer obtained through an earlier call to the <B>PrinterOpen</B> function.
</dd>
</DL>
