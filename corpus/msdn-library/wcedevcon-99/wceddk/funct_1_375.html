<H2><A NAME="_wceddk_wav_close"></A>WAV_Close</H2>

<P>This function closes the WAV I/O device.</P>

<H4>Syntax</H4>

<P><B>BOOL WAV_Close(DWORD</B> <I>dwOpenData</I><B>);</B></P>

<H4>Parameters</H4>

<DL>
<DT><I>dwOpenData</I></DT>

<DD>Specifies a value returned from a call to the <B>WAV_Open</B> function.
</dd>
</DL>

<H4>Return Values</H4>

<P>TRUE indicates success. FALSE indicates failure.</P>
