<H2><A NAME="_wceddk_com_deinit"></A>COM_Deinit</H2>

<P>This function de-initializes the serial port.</P>

<H4>Syntax</H4>

<P><B>BOOL COM_Deinit(void);</B></P>

<H4>Return Values</H4>

<P>None.</P>

<H4>Remarks</H4>

<P>This function is called by the <B>DeregisterDevice</B> function, which is exposed to applications.</P>

<P>This function is defined in the Mdd.c file.</P>

<P><A HREF="funct_1_47.htm"><B>COM_Init</B></A></P>
