<H2>

<A NAME="_wcesdk_closing_emulation"></A>Closing Emulation</H2>

<H4><IMG SRC="wedge.gif" ALT="" BORDER=0>&nbsp;&nbsp;&nbsp;&nbsp;To Close Emulation</H4>

<UL>
	<LI>In general, close the emulation environment the same way that you would close the target platform it is emulating. For example, to close the H/PC emulation, click the <B>Start</B> button on the simulated H/PC, then click <B>Suspend</B>.</li>
</UL>
