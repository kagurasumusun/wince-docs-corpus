<h1>TBM_SETTHUMBLENGTH</h1>
<p>Sets the length of the slider in a trackbar.</p>
<p>wParam = (WPARAM)(UINT) iLength;</p>
<p>lParam = 0;</p>
<p>Parameters</p>
<p>iLength</p>
<p>Length, in pixels, of the slider.</p>
<p>Return Values</p>
<p>No return value.</p>
<p>See Also</p>
<p>TBM_GETTHUMBLENGTH</p>
