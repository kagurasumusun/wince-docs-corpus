<h1>&lt;BASEFONT&gt;</h1>
<p>Changes the size of the BASEFONT that all relative &lt;FONT SIZE ...&gt; changes are based on. It has a valid range of 1-7.</p>
<p>SIZE</p>
<p>Sets a variable in the parser to which all &lt;FONT SIZE=+-n&gt; modifications are added.</p>
