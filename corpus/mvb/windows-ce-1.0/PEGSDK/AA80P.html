<h1>&lt;TEXTAREA&gt;</h1>
<p>The Textarea element lets users enter more than one line of text.  Use Multiline edit control.  See forms, and input for more information.</p>
<p>WRAP</p>
<p>Set flag in form header, and conditionally include the ES_AUTOVSCROLL flag in the edit control.</p>
