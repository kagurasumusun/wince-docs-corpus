<h1>&lt;DL&gt;</h1>
<p>Begin a definition list.  An automatically formatted two-column list with terms on the left and their definitions on the right is displayed.  DD and DT are ignored unless inside a DL.  Definition lists may not be nested. (See also &lt;DT&gt;, &lt;DD&gt;)</p>
