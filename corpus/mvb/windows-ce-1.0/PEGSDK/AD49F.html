<h1>EM_GETTHUMB</h1>
<p>An application sends the EM_GETTHUMB message to retrieve the position of the scroll box (thumb) in a multiline edit control.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>The return value is the position of the scroll box.</p>
