<h1>EM_GETLIMITTEXT</h1>
<p>An application sends the EM_GETLIMITTEXT message to retrieve the current text limit, in characters, for an edit control.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>The return value is the text limit.</p>
<p>See Also</p>
<p>EM_SETLIMITTEXT</p>
