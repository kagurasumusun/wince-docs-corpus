<h1>TBM_GETPOS</h1>
<p>Retrieves the current position of the slider in a trackbar.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>Returns a 32-bit value that specifies the current position.</p>
<p>See Also</p>
<p>TBM_SETPOS</p>
