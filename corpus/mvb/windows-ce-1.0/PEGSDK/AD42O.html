<h1>TBM_GETTHUMBLENGTH</h1>
<p>Retrieves the length of the slider in a trackbar.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>Returns the length, in pixels, of the slider.</p>
<p>See Also</p>
<p>TBM_SETTHUMBLENGTH</p>
