<h1>TBM_CLEARTICS</h1>
<p>Removes the current tick marks from a trackbar.</p>
<p>wParam = (WPARAM)(BOOL) fRedraw;</p>
<p>lParam = 0;</p>
<p>Parameters</p>
<p>fRedraw</p>
<p>Redraw flag. If this parameter is TRUE, the trackbar is redrawn after the tick marks are cleared.</p>
<p>Return Values</p>
<p>No return value.</p>
<p>See Also</p>
<p>TBM_SETTIC</p>
