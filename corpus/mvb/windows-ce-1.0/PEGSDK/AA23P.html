<h1>&lt;BGSOUND&gt;</h1>
<p>Plays a background sound.  This will take a long time to load over a slow link.</p>
<p>SRC</p>
<p>Specifies URL of sound.</p>
<p>LOOP</p>
<p>Loops the sound played.</p>
