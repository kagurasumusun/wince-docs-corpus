<h1>Size</h1>
<p>Interactive elements should be at least 23 pixels high and wide. This supports reasonable interaction with a stylus. Larger dimensions work better. If you plan to support touch interaction, then size your interface elements no smaller than 38 by 38 pixels.</p>
