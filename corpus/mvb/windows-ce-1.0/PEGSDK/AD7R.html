<h1>UDM_GETBUDDY</h1>
<p>Retrieves the handle of the current buddy window.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>Returns the handle of the current buddy window.</p>
