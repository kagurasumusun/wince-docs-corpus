<h1>CB_RESETCONTENT</h1>
<p>An application sends a CB_RESETCONTENT message to remove all items from the list box and edit control of a combo box. This message has no parameters.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>This message always returns CB_OKAY.</p>
<p>See Also</p>
<p>CB_DELETESTRING, WM_DELETEITEM</p>
