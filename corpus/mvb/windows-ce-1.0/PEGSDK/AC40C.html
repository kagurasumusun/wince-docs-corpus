<h1>POINTS</h1>
<p>The POINTS structure defines the coordinates of a point.</p>
<pre class="code">typedef struct tagPOINTS {- // pts</pre>
<p>SHORT x;</p>
<p>SHORT y;</p>
<p>} POINTS;</p>
<p>Members</p>
<p>x</p>
<p>Specifies the x-coordinate of the point.</p>
<p>y</p>
<p>Specifies the y-coordinate of the point.</p>
<p>See Also</p>
<p>ChildWindowFromPoint, PtInRect, WindowFromPoint, POINT</p>
