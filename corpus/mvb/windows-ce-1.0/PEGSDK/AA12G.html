<h1>Vibration Notifications</h1>
<p>Windows CE supports an option which allows a notification to make an HPC. Set the ActionFlags member of the PEG_USER_NOTIFICATION structure to PUN_VIBRATE. However, at this time no hardware manufacturers support the vibrate option.</p>
