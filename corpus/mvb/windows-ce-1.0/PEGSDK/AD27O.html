<h1>TBM_GETPTICS</h1>
<p>Retrieves the address of the array that contains the positions of tick marks for a trackbar.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>Returns the address of the array.</p>
<p>See Also</p>
<p>TBM_GETTIC</p>
