<h1>execOnUnload</h1>
<p>execOnUnload  exefile</p>
<p>The execOnUnload statement adds the name of an executable file to the end of the unload script. The file is executed when the unload script is run on the HPC.</p>
<p>Parameters</p>
<p>exefile</p>
<p>Specifies the name of the executable file.</p>
