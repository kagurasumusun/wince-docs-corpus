<h1>&lt;DD&gt;</h1>
<p>The descriptive definition associated with a definition term &lt;DT&gt; in a Definition List.  (See also &lt;DL&gt; and &lt;DT&gt;)  The &lt;DD&gt; text will appear in the right hand column of the definition list.</p>
