<h1>&lt;KBD&gt;</h1>
<p>The Keyboard element indicates text typed by a user; typically rendered as monospaced . It might commonly be used in an instruction manual.  Use Courier font, size relatively equal to current font size setting.  Same as &lt;CODE&gt;.</p>
