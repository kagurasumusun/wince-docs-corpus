<h1>Unsupported APIs</h1>
<p>Following is a list of some of the major API groups not implemented for version 1 of Windows CE:</p>
<p>Active X</p>
<p>DDE</p>
<p>Multimedia</p>
<p>ODBC</p>
<p>OLE, COM</p>
<p>Printing</p>
