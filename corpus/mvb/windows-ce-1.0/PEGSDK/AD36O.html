<h1>TBM_GETSELEND</h1>
<p>Retrieves the ending position of the current selection in a trackbar.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>Returns a 32-bit value that specifies the ending position of the current selection.</p>
<p>See Also</p>
<p>TBM_GETSELSTART, TBM_SETSELEND</p>
