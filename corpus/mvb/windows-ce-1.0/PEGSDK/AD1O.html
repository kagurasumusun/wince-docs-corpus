<h1>TBM_CLEARSEL</h1>
<p>Clears the current selection in a trackbar.</p>
<p>wParam = (WPARAM)(BOOL) fRedraw;</p>
<p>lParam = 0;</p>
<p>Parameters</p>
<p>fRedraw</p>
<p>Redraw flag. If this parameter is TRUE, the trackbar is redrawn after the selection is cleared.</p>
<p>Return Values</p>
<p>No return value.</p>
<p>See Also</p>
<p>TBM_SETSEL</p>
