<h1>Floating Point Operations</h1>
<p>Windows CE supports, in large part, the IEEE binary floating-point standard, the ANSI C standard, and Microsoft Visual C/C++. There are, however, some differences, as code size and run-time performance both represent critical Windows CE platform resources.</p>
