<h1>TB_ISBUTTONENABLED</h1>
<p>The TB_ISBUTTONENABLED message determines whether the specified button in a toolbar is enabled.</p>
<p>wParam = (WPARAM) idButton;</p>
<p>lParam = 0;</p>
<p>Parameters</p>
<p>idButton</p>
<p>Command identifier of the button.</p>
<p>Return Values</p>
<p>Returns nonzero if the button is enabled or zero otherwise.</p>
