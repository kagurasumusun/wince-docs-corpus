<h1>Icons and Bitmaps</h1>
<p>Windows CE does not support pre-defined icons (IDI_*). You must provide icon bitmaps for your programs if you wish to use them. All icons and other bitmaps must be in the 2-bits per pixel format (.2bp for bitmaps and .ic2 for icons) format.</p>
