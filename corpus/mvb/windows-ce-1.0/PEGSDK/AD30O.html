<h1>TBM_GETRANGEMAX</h1>
<p>Retrieves the maximum position for the slider in a trackbar.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>Returns a 32-bit value that specifies the maximum position.</p>
<p>See Also</p>
<p>TBM_GETRANGEMIN, TBM_SETRANGEMAX</p>
