<h1>LB_RESETCONTENT</h1>
<p>An application sends an LB_RESETCONTENT to remove all items from a list box. This message has no parameters.</p>
<p>wParam = 0;	// not used, must be zero</p>
<p>lParam = 0;	// not used, must be zero</p>
<p>Return Values</p>
<p>This message does not return a value.</p>
<p>See Also</p>
<p>WM_DELETEITEM</p>
