<h1>Icon Size</h1>
<p>Include an icon as part of your application’s executable. In addition, define and register icons for both 16 by 16 pixel and 32 by 32 pixel sizes for your application’s document.</p>
<p>Standard icon size</p>
<p>Windows CE currently only supports grayscale (2 bits per pixel) for icons.</p>
