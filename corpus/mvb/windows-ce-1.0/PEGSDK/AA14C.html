<h1>Handling Low Memory Situations</h1>
<p>An HPC is a low memory device, and RAM is always at a premium. No matter how stingy applications are about using RAM, it is always possible for the system to run out. Running out of memory implies that the VirtualAlloc function cannot find any unallocated pages.</p>
