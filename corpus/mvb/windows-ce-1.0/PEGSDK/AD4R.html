<h1>UDM_GETBASE</h1>
<p>Retrieves the current radix base (that is, either base 10 or 16) for an up-down control.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>Returns the current base value.</p>
<p>See Also</p>
<p>UDM_SETBASE</p>
