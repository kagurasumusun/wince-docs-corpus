<h1>TBM_GETNUMTICS</h1>
<p>Retrieves the number of tick marks in a trackbar.</p>
<p>wParam = 0;</p>
<p>lParam = 0;</p>
<p>Return Values</p>
<p>Returns the number of tick marks.</p>
<p>See Also</p>
<p>TBM_GETPTICS, TBM_SETTIC</p>
