<h1>WM_KEYLAST</h1>
<p>Keyboard message filter value.</p>
<p>Remarks</p>
<p>Use WM_KEYFIRST and WM_KEYLAST to filter for keyboard messages when using GetMessage and PeekMessage.</p>
