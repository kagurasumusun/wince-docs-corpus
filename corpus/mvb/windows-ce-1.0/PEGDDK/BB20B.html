<h1>Device Manager Functions</h1>
<p>If the Plug and Play ID does not exist, the Device Manager’s detection routine calls a PFN_DETECT_ENTRY function in the client driver. In this case, the Entry value under the HKEY_LOCAL_MACHINE\Drivers\PCMCIA\Detect\nn key specifies the name of the entry function.</p>
