<h1>CARD_EVENT</h1>
<p>The 32-bit CARD_EVENT is used for an event code in a registered client callback function. Card Services calls the callback function when an associated PC Card event occurs.</p>
<p>See Also</p>
<p>Event Codes, CardRegisterClient, ClientCallback</p>
