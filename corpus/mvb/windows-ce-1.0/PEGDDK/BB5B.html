<h1>The BuiltIn Key</h1>
<p>The Device Manager uses the HKEY_LOCAL_MACHINE\Drivers\BuiltIn key and its subkeys and entries to identify the drivers for the built-in devices, such as the serial port and infrared port. This key is normally used only by the Device Manager.</p>
