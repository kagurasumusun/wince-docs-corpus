<h1>Duplicating Source Windows</h1>
<p>New Window</p>
<p>The New Window command opens a new window to the source file. This command is valid only for source windows.</p>
<p>If Overlay Source is checked, then any new source windows that you open will appear in the same location at which the first source window opened.</p>
