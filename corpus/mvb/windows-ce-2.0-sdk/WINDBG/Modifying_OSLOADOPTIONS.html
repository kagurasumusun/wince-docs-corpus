<h1>Modifying OSLOADOPTIONS</h1>
<p>1.	At the ARC firmware prompt, select Run Setup.</p>
<p>2.	From the first menu, select Manage Startup.</p>
<p>3.	From the second menu select Change a Boot Selection.</p>
<p>4.	Edit the OSLOADOPTIONS variable:</p>
<p>OSLOADOPTIONS=option1 option2 ...</p>
<p>For example:</p>
<p>OSLOADOPTIONS=DEBUG</p>
</body>
