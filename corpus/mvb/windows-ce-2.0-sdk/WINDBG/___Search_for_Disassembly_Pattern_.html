<h1># (Search for Disassembly Pattern)</h1>
<p>Syntax</p>
<p># [[pattern]] [[address]]</p>
<p>Parameters</p>
<p>pattern</p>
<p>The pattern to search for in the Disassembly window.</p>
<p>address</p>
<p>The address after which to search.</p>
<p>Description</p>
<p>Displays the first line of assembly code after address that contains the specified pattern.</p>
