<h1>Control-menu Box</h1>
<p>The icon (symbolized by a spacebar) that appears in the upper-left corner of a window. The Control-menu box opens the Control menu for the window.</p>
<p>When a window is maximized in WinDbg, the Control-menu box for the window appears as the first item in the menu bar for WinDbg.</p>
