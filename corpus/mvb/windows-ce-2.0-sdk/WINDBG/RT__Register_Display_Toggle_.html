<h1>RT (Register Display Toggle)</h1>
<p>Syntax</p>
<p>[[thread]] RT</p>
<p>Parameters</p>
<p>thread</p>
<p>The thread from which the registers are to be read. See Process and Thread Syntax.</p>
<p>Description</p>
<p>Toggles the register display (WinDbg KD only). The default is off.</p>
