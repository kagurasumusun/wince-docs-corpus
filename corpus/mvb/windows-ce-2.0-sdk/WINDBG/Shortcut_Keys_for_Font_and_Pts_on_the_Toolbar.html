<!-- WINDBG Books Online (windbg.hlp); text extracted with helpdeco, images dropped. -->
<h1>Shortcut Keys for Font and Pts on the Toolbar</h1>
<table class="dtTABLE">
<tr><td>Action</td><td>Shortcut Key(s)</td></tr>
<tr><td>Make Font control active</td><td>alt+n</td></tr>
<tr><td>Make Pts control active</td><td>alt+s</td></tr>
<tr><td>Move between Font and Pts controls once both active</td><td>tab</td></tr>
<tr><td>Move through Font and Pts selections</td><td>arrow keys, home, end, pgup, pgdn</td></tr>
<tr><td>Confirm selection</td><td>enter</td></tr>
<tr><td>Cancel selection</td><td>esc</td></tr>
</table>
</body>
