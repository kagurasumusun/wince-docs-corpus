<h1>Definition of a Resource</h1>
<p>A resource is read-only data stored in your application's EXE file or DLL. Windows reads a resource from disk on demand. Certain types of resources have prescribed formats recognized by Windows. These include bitmaps, icons, cursors, dialog boxes, and fonts.</p>
