<h1>Getting Help on the Environment</h1>
<p>Getting Help</p>
<p>You can get help in several ways:</p>
<pre class="code">·	From the Help Contents screen.</pre>
<pre class="code">·	From the Help Search function.</pre>
<pre class="code">·	By pressing F1 while a menu command is highlighted or a dialog box is active.</pre>
<pre class="code">·	By choosing the Help button in a dialog box.</pre>
