<h1>Executing a Program</h1>
<p>Use the Go command from the Run menu (F5) to start or continue a program. The program proceeds from the current statement until one of the following occurs:</p>
<pre class="code">·	The program reaches a breakpoint</pre>
<pre class="code">·	An exception occurs in the program</pre>
<pre class="code">·	The program ends</pre>
