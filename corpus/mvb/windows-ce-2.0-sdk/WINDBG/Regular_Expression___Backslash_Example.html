<h1>Regular Expression---Backslash Example</h1>
<table class="dtTABLE">
<tr><td>Character:</td><td>Backslash \</td></tr>
<tr><td>Matches:</td><td>Interprets the next character literally</td></tr>
<tr><td>Example:</td><td>x\*y</td></tr>
<tr><td>The example above finds "x*y". Characters preceded by a backslash lose their special meanings and are treated literally.</td></tr>
</table>
