<h1>19UL946</h1>
<p>Select this option to enable your program’s windows to use a splitter bar. The splitter bar will split the program's main views. In an MDI program, the MDI child frame's client window is a splitter window, and in an SDI program, the main frame's client window is a splitter window.</p>
