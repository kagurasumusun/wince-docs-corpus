<h1>1XZPD0P</h1>
<p>When enabled, sets m_bCheckCacheForDirtyFields to TRUE which creates a data cache to detect whether data values or NULL status has changed. For more information, see DAO RecordFieldExchange: Double Buffering Records in Programming with MFC: Encyclopedia.</p>
