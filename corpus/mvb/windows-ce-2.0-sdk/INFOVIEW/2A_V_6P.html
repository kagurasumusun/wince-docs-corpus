<h1>2A_V_6P</h1>
<p>Generates an include file (.H) that contains the types definitions from the Object Description Language file (.ODL). The generated file can be included in a C or a C++ file.This option is available only if you select an .ODL file in the Source Files folder of the Settings For list box.</p>
