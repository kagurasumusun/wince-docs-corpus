<h1>JA94DW</h1>
<p>Displays memory contents in a fixed-width format when checkbox is selected. Use the textbox to specify the width. Width units are determined by the format selected above. For example, if you choose short and set the width to 4, each row in the Memory window will display four short values.</p>
