<h1>WP8U3</h1>
<p>Image Editor Window</p>
<p>The Image Editor window is used within the Graphics editor to edit bitmaps, GIFs, JPEGs, icons, and cursors.</p>
<p>Note   The Image Editor window does not have a shortcut menu because the right mouse button is used for image editing functions.</p>
