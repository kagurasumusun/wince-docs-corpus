<h1>I8QQ.3</h1>
<p>Provides a space for you to specify the directory for the new project files. You can type a path or select one by using the browse button to the right of the Location box.</p>
<p>Note for Visual J++ users: Changing the default location is not recommended for Visual J++ projects.</p>
