<h1>27B5.S5</h1>
<p>Specifies one of four predetermined optimization categories: Default, Disable, Maximize Speed, and Minimize Size. If you specify Customize from this, the General category, you can use a list box in the Optimizations category to specify a custom set of optimizations.</p>
