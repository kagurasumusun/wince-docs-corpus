<h1>166046O</h1>
<p>By default this box displays the extension you enter in the File Extension box and names the file type after your program. For example, if your project is named Foo, and the file extension is .foo, the filter name is: “Foo Files (*.foo)” Of course, you can edit the text in this box.</p>
