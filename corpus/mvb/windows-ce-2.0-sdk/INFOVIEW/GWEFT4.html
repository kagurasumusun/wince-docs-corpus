<h1>GWEFT4</h1>
<p>ResourceView</p>
<p>ResourceView displays the resource files included in your projects. Expanding the folder shows the resource types. Expanding each resource type shows the individual resources of that type. You can right-click on this window to bring up a shortcut menu of commands.</p>
