<h1>2CSHLVN</h1>
<p>Lists the hue (color wheel value) of the color you are defining. Values range from 0 to 240, where 0 is red, 60 is yellow, 120 is green, 180 is cyan, 200 is magenta, and 240 is blue.</p>
