<h1>KFLN1U</h1>
<p>Displays a list of Go To items such as Address, Bookmark, and Definition. For example, Address jumps to any valid debugger expression in the Memory or Disassembly window. In the Binary Data editor, Offset jumps to the specified hexadecimal offset in the file.</p>
