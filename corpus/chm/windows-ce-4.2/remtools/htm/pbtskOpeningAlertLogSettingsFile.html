<H1 class="dtH1"><A NAME="pbtskopeningalertlogsettingsfile"></A>Opening an Alert Log Settings File</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<OL type="1">
	<LI>From the <B>File</B> menu, choose <B>Open</B>.</li>

	<LI>Navigate to the directory that contains a .pma file.</li>

	<LI>In the <B>File name</B> box, enter the name of the .pma file.</li>

	<LI>Choose <B>Open</B>.</li>
</OL>
