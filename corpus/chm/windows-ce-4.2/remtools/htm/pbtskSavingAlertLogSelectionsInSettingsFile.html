<H1 class="dtH1"><A NAME="pbtsksavingalertlogselectionsinsettingsfile"></A>Saving Alert Log Selections in a Settings File</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<OL type="1">
	<LI>From the <B>File</B> menu, choose <B>Save Alert Settings As</B>.</li>

	<LI>Navigate to the directory in which you want to save the file.</li>

	<LI>In the <B>File name</B> box, type a name for the file.</li>

	<LI>Choose <B>Save</B>.</li>
</OL>
