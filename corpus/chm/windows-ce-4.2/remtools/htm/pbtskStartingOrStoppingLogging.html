<H1 class="dtH1"><A NAME="pbtskstartingorstoppinglogging"></A>Starting or Stopping Logging</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<OL type="1">
	<LI>From the <B>Options</B> menu, choose <B>Log</B>.</li>

	<LI>Choose <B>Start Log</B>.
<P>If <B>Start Log</B> is not enabled, you must first type a name in the <B>File Name</B> box and add objects to log.
</li>

	<LI>Choose <B>Stop Log</B> to stop logging.</li>
</OL>
