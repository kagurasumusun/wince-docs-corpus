<H1 class="dtH1"><A NAME="pbtskaddingnewwindowtoremotezoom-in"></A>Adding a New Window to Remote Zoom-in</H1>

<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<UL type="disc">
	<LI>From the <B>File</B> menu, choose <B>New Bitmap</B>.
<P>- or -

<P>From the <B>Window</B> menu, choose <B>New Window</B>.

<P>Remote Zoom-in opens a new window that contains the latest screen image from the target device.
</li>
</UL>
