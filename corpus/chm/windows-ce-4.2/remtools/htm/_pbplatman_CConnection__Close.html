<DIV id="nstext" valign="bottom">
<P>This method closes the current connection.</P>

<PRE class="syntax"><B>BOOL CConnection::Close() </B></PRE>

<H4 class="dtH4">Parameters</H4>

<P>None.</P>

<H4 class="dtH4">Return Values</H4>

<P>TRUE indicates success; FALSE indicates failure.</P>
