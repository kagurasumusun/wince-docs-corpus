<H1 class="dtH1"><A NAME="pbtskdisplayingmessagesforwindow"></A>Displaying Messages for a Window</H1>
</div></div>
<!--NONSCROLLING BANNER END-->
<DIV id="nstext" valign="bottom">
<OL type="1">
	<LI>From the <B>Spy</B> menu, choose <B>Windows List</B>.</li>

	<LI>In the Windows List (Windows CE) window, select the icon corresponding to a window on the target device.</li>

	<LI>From the <B>Spy</B> menu, choose <B>Messages</B>.</li>
</OL>
