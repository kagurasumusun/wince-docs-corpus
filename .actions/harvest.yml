# Updated harvest workflow for the reorganized tree.
#
# GitHub only executes workflow files that live in .github/workflows/, and
# pushing changes under that path requires a token with the `workflows`
# permission, which the token available for this reorganization does not
# have. The .github/workflows/harvest.yml copy is therefore left untouched
# (it still refers to the pre-reorganization paths: urls/, docs/,
# tools/make-index.py, data/harvest/).
#
# To activate this version, with a token that has the `workflows`
# permission, either
#
#     git mv .actions/harvest.yml .github/workflows/harvest.yml
#     git commit -m "harvest: install the updated workflow"
#     git push
#
# or copy the file's contents over .github/workflows/harvest.yml (for
# example through the GitHub web UI).
#
# Differences from the .github copy:
#   * --queue "queues/${{ github.event.inputs.queue }}"
#   * python3 tools/build-index.py   (was tools/make-index.py)
#   * git add data/index/ corpus/ data/logs/   (was docs/, data/harvest/)

name: Windows CE Documentation Harvester

on:
  workflow_dispatch:
    inputs:
      queue:
        description: 'URL queue file under queues/ (e.g. to-fetch-mslearn.txt, wayback-msdn-2010.txt)'
        required: true
        default: 'to-fetch-mslearn.txt'
      limit:
        description: 'Limit number of URLs to fetch (0 for all)'
        required: false
        default: '0'
      batch:
        description: 'Pages per batch commit & push'
        required: false
        default: '500'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run harvester (sequential, rate-limited, batch push)
        run: |
          git config user.name "wince-docs-corpus harvester"
          git config user.email "wince-corpus-harvester@users.noreply.github.com"
          LIMIT_ARG=""
          if [ "${{ github.event.inputs.limit }}" != "0" ]; then
            LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"
          fi
          python3 tools/harvest.py \
            --queue "queues/${{ github.event.inputs.queue }}" \
            --batch "${{ github.event.inputs.batch }}" $LIMIT_ARG --push

      - name: Refresh index and final push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 tools/build-index.py
          python3 tools/build-index-sql.py
          git add data/index/ corpus/ data/logs/ || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "corpus: index refresh + final harvest batch"
            git pull --rebase
            git push
          fi
